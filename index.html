{"id":"UfePqpx","zh":"史密斯机硬拉","en":"smith deadlift","bp":"腘绳肌","eq":"史密斯","tg":"腘绳肌","sec":"臀大肌","fx":"将史密斯机设置为与臀部高度相同的杠铃。\n双脚分开与肩同宽站立，脚趾稍微向外。\n弯曲臀部和膝盖，保持背部挺直，挺胸，正手握住杠铃，握距略宽于肩宽。\n伸展臀部和膝盖，调动核心力量并举起杠铃，保持杠铃靠近身体。\n站直，充分伸展臀部和膝盖。\n通过弯曲臀部和膝盖来降低杠铃，保持控制并保持背部挺直。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/UfePqpx.webp"},{"id":"ETZfAbZ","zh":"下斜史密斯卧推","en":"smith decline bench press","bp":"胸","eq":"史密斯","tg":"胸大肌中下部","sec":"肱三头肌","fx":"将下斜凳调整至所需角度。\n躺在长凳上，双脚固定在脚垫下。\n正手握住杠铃，握距略宽于肩宽。\n松开杠铃，慢慢将其降低到胸部，保持肘部内收。\n在底部停顿片刻，然后将杠铃推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ETZfAbZ.webp"},{"id":"lFhb2Rw","zh":"史密斯颈前深蹲","en":"smith front squat (clean grip)","bp":"股四头肌","eq":"史密斯","tg":"股四头肌","sec":"臀大肌","fx":"将杠铃置于肩高的史密斯机上。\n面向杠铃站立，双脚与肩同宽。\n正手握住杠铃，握距略宽于肩宽。\n后退一步，将杠铃放在前肩上，放在锁骨和三角肌上。\n保持挺胸、背部挺直、核心收紧。\n弯曲膝盖和臀部，降低身体，就像坐回椅子上一样。\n继续降低，直到大腿与地面平行或略低于地面。\n暂停片刻，然后用力推动脚后跟，回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/lFhb2Rw.webp"},{"id":"NNoHCEA","zh":"史密斯机全程深蹲","en":"smith full squat","bp":"臀部,股四头肌","eq":"史密斯","tg":"臀大肌、股四头肌","sec":"腘绳肌、小腿腓肠肌","fx":"将杠铃置于肩高的史密斯机上。\n站立，双脚分开与肩同宽，脚趾稍微向外。\n走到杠铃下方，将其放在上背部上方，放在斜方肌上。\n双手握住杠铃，距离略大于肩宽。\n松开杠铃并后退一步，保持稳定的姿势。\n保持胸部挺直，核心参与，通过将臀部向后推并弯曲膝盖来开始深蹲。\n降低你的身体，直到你的大腿与地面平行，或者在你的灵活性允许的范围内尽可能低。\n在底部停顿片刻，然后用脚后跟恢复到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/NNoHCEA.webp"},{"id":"ZuPXtCK","zh":"史密斯哈克深蹲","en":"smith hack squat","bp":"股四头肌","eq":"史密斯","tg":"股四头肌","sec":"臀大肌","fx":"将史密斯机上的杠铃调整到适合您身体的高度。\n双脚分开与肩同宽站立，脚趾稍微向外。\n将自己置于杠铃下方，将其放在斜方肌上部和肩膀上。\n正手握住杠铃，握距略宽于肩宽。\n当你打开杠铃时，启动你的核心并保持挺胸。\n后退一步，双脚分开的距离略大于肩宽。\n弯曲膝盖，降低身体，保持挺胸、背部挺直。\n继续下降，直到大腿与地面平行或略低于地面。\n在底部停顿片刻，然后推动脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ZuPXtCK.webp"},{"id":"CqhoytW","zh":"仰卧史密斯机卷髋","en":"smith hip raise","bp":"腹部","eq":"史密斯","tg":"腹肌中下","sec":"","fx":"将自己放在史密斯机上，背部靠在垫子上，双脚分开与肩同宽。\n将双手放在杠铃上，距离略宽于肩宽。\n启动你的核心肌群和臀大肌，然后通过脚后跟将臀部抬离地面。\n继续提升，直到身体从膝盖到肩膀形成一条直线。\n在顶部保持片刻，然后慢慢将臀部放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/CqhoytW.webp"},{"id":"5v7KYld","zh":"上斜史密斯卧推","en":"smith incline bench press","bp":"胸","eq":"史密斯","tg":"胸大肌中上束","sec":"肱三头肌","fx":"将长凳调整至 30-45 度倾斜。\n坐在长凳上，背部平放在垫子上，双脚牢牢踩在地上。\n正手握住杠铃，握距略宽于肩宽。\n松开杠铃，慢慢地将其降低到上胸部，保持肘部稍微内收。\n在底部停顿片刻，然后将杠铃推回起始位置，充分伸展双臂。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/5v7KYld.webp"},{"id":"78VqWQK","zh":"上斜史密斯反手推举卧推","en":"smith incline reverse-grip press","bp":"肱三头","eq":"史密斯","tg":"胸肌、三角肌、肱三头肌","sec":"肱三头肌、三角肌","fx":"将史密斯机的座椅调整到舒适的倾斜角度。\n坐在机器上，背部靠在垫子上，双脚平放在地面上。\n正手握住杠铃，握距略宽于肩宽。\n松开杠铃并将其缓慢降低至胸部，同时保持肘部内收。\n当杠铃位于胸部正上方时，暂停片刻。\n将杠铃推回到起始位置，完全伸展双臂。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/78VqWQK.webp"},{"id":"ayAHcEm","zh":"上斜直臂肩胛推","en":"smith incline shoulder raises","bp":"前锯肌","eq":"史密斯","tg":"前锯肌","sec":"","fx":"将史密斯机调整至倾斜位置。\n面向机器站立，双脚分开与肩同宽。\n正手握住杠铃，握距略宽于肩宽。\n保持背部挺直，核心参与。\n将杠铃举向天花板，用肘部引导。\n在顶部停顿片刻，然后慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ayAHcEm.webp"},{"id":"7zdxRTl","zh":"史密斯倒蹬‌","en":"smith leg press","bp":"臀部,股四头肌","eq":"史密斯","tg":"臀大肌、股四头肌","sec":"","fx":"将史密斯机的座椅和脚踏板调整到舒适的位置。\n坐在机器上，背部靠在靠背上，双脚与肩同宽放在踏板上。\n抓住机器的手柄或侧面以保持稳定性。\n伸展双腿，使背部紧靠靠背，将脚踏板推离您。\n在完全伸展的位置暂停片刻。\n慢慢弯曲膝盖，将脚踏板向您的方向放低，回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/7zdxRTl.webp"},{"id":"RGLscZM","zh":"史密斯低杠深蹲","en":"smith low bar squat","bp":"臀部","eq":"史密斯","tg":"臀大肌","sec":"股四头肌","fx":"将史密斯机与杠铃设置在一个高度，以便您可以将其舒适地放在上背部。\n站立，双脚分开与肩同宽，脚趾稍微向外转动。\n走到杠铃下方，将其放在上背部上方，将其放在斜方肌上。\n双手握住杠铃，距离略大于肩宽。\n伸直双腿并从架子上退后，将杠铃松开。\n深呼吸并支撑你的核心。\n通过向后推臀部并弯曲膝盖来开始深蹲。\n降低身体，直到大腿与地面平行或稍低于地面。\n在整个动作过程中保持挺胸、背部挺直。\n通过脚后跟站起来，伸展臀部和膝盖。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/RGLscZM.webp"},{"id":"zILLZ98","zh":"史密斯二头弯举","en":"smith machine bicep curl","bp":"肱二头","eq":"史密斯","tg":"肱二头肌","sec":"","fx":"将史密斯机杆的高度调整到腰部水平。\n面对史密斯机站立，双脚与肩同宽。\n反手握住杠铃，双手间距略大于肩宽。\n保持肘部靠近身体两侧，上臂保持静止。\n呼气并将杠铃向上卷向肩膀，收缩二头肌。\n在动作的最高点暂停片刻，挤压你的二头肌。\n吸气并慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/zILLZ98.webp"},{"id":"yB9SvIF","zh":"下斜史密斯窄距卧推","en":"smith machine decline close grip bench press","bp":"胸","eq":"史密斯","tg":"胸大肌中下部","sec":"肱三头肌","fx":"将史密斯机上的长凳调整至下降位置。\n躺在长凳上，双脚牢牢踩在地上。\n紧紧握住杠铃，握距略窄于肩宽。\n松开杠铃并将其缓慢降低至胸部，保持肘部靠近身体。\n当杠铃位于胸部正上方时，暂停片刻。\n将杠铃推回到起始位置，完全伸展双臂。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/yB9SvIF.webp"},{"id":"o8aOcrz","zh":"上斜史密斯臂屈伸","en":"smith machine incline tricep extension","bp":"肱三头","eq":"史密斯","tg":"肱三头肌","sec":"","fx":"调整史密斯机的座椅，使杠铃处于肩部高度。\n坐在长凳上，背部靠在垫子上，双脚平放在地上。\n正手握住杠铃，握距略宽于肩宽。\n充分伸展双臂，将杠铃从架子上提起，并将其保持在胸部正上方。\n慢慢地将杠铃降低到前额，保持肘部靠近头部。\n在底部暂停片刻，然后将杠铃推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/o8aOcrz.webp"},{"id":"JGKowMS","zh":"史密斯机窄距划船","en":"smith narrow row","bp":"背","eq":"史密斯","tg":"背阔肌中上部","sec":"肱二头肌","fx":"调整座椅高度并将自己放在机器上，双脚平放在地板上。\n正手握住手柄，握距略窄于肩宽。\n当您将手柄拉向身体时，保持背部挺直，挺胸，将肩胛骨挤压在一起。\n在动作的最高点暂停片刻，然后慢慢松开手柄回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/JGKowMS.webp"},{"id":"9GXrTE6","zh":"史密斯单腿地面提踵","en":"smith one leg floor calf raise","bp":"小腿三头肌","eq":"史密斯","tg":"小腿三头肌","sec":"","fx":"将自己放在史密斯机杆下方的地板上，背对机器。\n将脚掌放在凸起的表面上，例如举重板或杠铃块。\n将史密斯机杆放在小腿上，就在脚踝上方。\n用手握住横杆以保持稳定。\n伸展脚踝，将脚后跟抬离地面，抬起身体。\n在动作的最高点暂停，然后慢慢降低脚跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/9GXrTE6.webp"},{"id":"nFUwqG6","zh":"史密斯机后三角划船","en":"smith rear delt row","bp":"肩","eq":"史密斯","tg":"三角肌后束","sec":"菱形肌、肱二头肌","fx":"调整座椅高度，将自己放在机器上，胸部靠在垫子上，双脚平放在地面上。\n正手握住手柄，握距略宽于肩宽。\n将手柄拉向胸部，将肩胛骨挤压在一起，保持背部挺直，核心肌群参与。\n在动作的最高点暂停片刻，然后慢慢松开手柄回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/nFUwqG6.webp"},{"id":"Lsqrgh4","zh":"史密斯提踵","en":"smith reverse calf raises","bp":"小腿三头肌","eq":"史密斯","tg":"小腿三头肌","sec":"","fx":"将史密斯机杆调整到略低于肩膀的高度。\n面向杠铃站立，双脚分开与臀部同宽，脚趾向前。\n将脚掌放在台阶或平台的边缘，脚后跟悬空。\n抓住横杆以获得支撑。\n尽可能高地抬高脚跟，将身体抬起到脚趾上。\n在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/Lsqrgh4.webp"},{"id":"aaxA3cm","zh":"史密斯反握俯身划船","en":"smith reverse grip bent over row","bp":"背","eq":"史密斯","tg":"背阔肌中上部","sec":"肱二头肌","fx":"将史密斯机设置为与臀部高度相同的杠铃。\n面向杠铃站立，双脚分开与肩同宽。\n稍微弯曲膝盖，髋部向前转动，保持背部挺直。\n反手握住杠铃，双手与肩同宽。\n将杠铃拉向下胸部，将肩胛骨挤压在一起。\n在顶部暂停片刻，然后慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/aaxA3cm.webp"},{"id":"0S75mYG","zh":"坐姿史密斯单腿提踵","en":"smith seated one leg calf raise","bp":"小腿三头肌","eq":"史密斯","tg":"比目鱼肌","sec":"","fx":"坐在机器上，背部靠在垫子上，双脚放在脚踏板上。\n将一条腿放在脚踏板上，另一条腿离开脚踏板。\n使用小腿肌肉，尽可能高地抬高脚跟。\n在顶部暂停片刻，然后慢慢将脚跟放回起始位置。\n重复所需的重复次数，然后换腿并重复。","tp":"训练","risk":false,"img":"img/0S75mYG.webp"},{"id":"xUwnBMT","zh":"坐姿史密斯机推肩","en":"smith seated shoulder press","bp":"肩","eq":"史密斯","tg":"三角肌前束","sec":"肱三头肌","fx":"调整座椅高度，使手柄与肩部齐平。\n坐在机器上，背部靠在垫子上，双脚平放在地板上。\n正手握住手柄，将其提离支撑物，充分伸展双臂。\n将手柄降低至肩部水平，保持肘部稍微弯曲。\n将手柄向上推过头顶，直到手臂完全伸展。\n在顶部暂停片刻，然后慢慢将手柄放回至肩部水平。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/xUwnBMT.webp"},{"id":"B6dAO1t","zh":"坐姿史密斯机腕弯举","en":"smith seated wrist curl","bp":"小臂","eq":"史密斯","tg":"小臂屈肌","sec":"","fx":"坐在史密斯机前的长凳上，双脚平放在地面上。\n反握抓住杠铃，双手与肩同宽。\n将前臂放在大腿上，让手腕悬垂。\n慢慢向上弯曲手腕，将杠铃拉向前臂。\n在顶部停顿片刻，然后慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/B6dAO1t.webp"},{"id":"903mzG8","zh":"坐姿史密斯宽握推肩","en":"smith shoulder press","bp":"肩","eq":"史密斯","tg":"三角肌前束","sec":"肱三头肌","fx":"调整座椅高度，将自己放在史密斯机上，双脚分开与肩同宽。\n正手握住杠铃，握距略宽于肩宽。\n将杠铃从架子上提起，并将其置于与肩同高的位置，肘部弯曲，手掌朝前。\n向上推杠铃，直到手臂完全伸过头顶。\n在顶部暂停片刻，然后慢慢将杠铃放回至肩部水平。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/903mzG8.webp"},{"id":"OUQ0ZyW","zh":"史密斯耸肩","en":"smith shrug","bp":"斜方肌","eq":"史密斯","tg":"斜方肌","sec":"","fx":"双脚分开与肩同宽站立，膝盖稍微弯曲。\n正手握住杠铃，双手间距略宽于肩宽。\n保持双臂伸直，肩膀放松。\n将肩膀向耳朵方向抬起，在顶部挤压斜方肌。\n保持一会儿，然后慢慢将肩膀放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/OUQ0ZyW.webp"},{"id":"wWFspEi","zh":"史密斯保加利亚箭步蹲","en":"smith single leg split squat","bp":"股四头肌","eq":"史密斯","tg":"股四头肌","sec":"臀大肌","fx":"站在史密斯机前，双脚分开与肩同宽。\n将一只脚放在身后的长凳或台阶上，脚趾向前。\n握住史密斯机杆以保持稳定性。\n弯曲前膝盖，将身体降低到弓步位置，保持背部挺直。\n在底部停顿片刻，然后推动前脚跟回到起始位置。\n重复所需的重复次数，然后换腿。","tp":"训练","risk":false,"img":"img/wWFspEi.webp"},{"id":"HsjbB1z","zh":"史密斯箭步蹲","en":"smith sprint lunge","bp":"臀部,股四头肌","eq":"史密斯","tg":"臀大肌、股四头肌","sec":"","fx":"将杠铃置于臀部高度的史密斯机上。\n背对机器站立，双脚与肩同宽。\n右脚向后退一步，将其放在杠铃上，将脚尖放在杠上。\n弯曲左膝，将身体降低到弓步位置，保持背部挺直。\n推动左脚跟返回到起始位置。\n在另一侧重复，左脚向后退一步。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/HsjbB1z.webp"},{"id":"hfmQ0Tz","zh":"站姿史密斯背腕弯举","en":"smith standing back wrist curl","bp":"小臂","eq":"史密斯","tg":"小臂屈肌","sec":"","fx":"面对史密斯机站立，双脚与肩同宽。\n正手握住杠铃，双手与肩同宽。\n保持背部挺直，肘部靠近身体。\n慢慢向上弯曲手腕，将杠铃拉向身体。\n在顶部停顿片刻，然后慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/hfmQ0Tz.webp"},{"id":"ht8xDrP","zh":"站姿史密斯颈后实力推","en":"smith standing behind head military press","bp":"肩","eq":"史密斯","tg":"三角肌前","sec":"肱三头肌","fx":"调整史密斯机的座椅高度，使杠铃与肩部齐平。\n双脚分开与肩同宽站立，膝盖稍微弯曲。\n正手握住杠铃，握距略宽于肩宽。\n将杠铃从架子上抬起并向后退一步，保持稳定的姿势。\n将杠铃放在脑后，放在斜方肌上部。\n在整个练习过程中保持核心收紧并抬起胸部。\n伸展双臂，完全伸直，将杠铃推过头顶。\n在动作的最高点稍作停顿，然后慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ht8xDrP.webp"},{"id":"6MaEjVA","zh":"站姿史密斯提踵","en":"smith standing leg calf raise","bp":"小腿三头肌","eq":"史密斯","tg":"小腿三头肌","sec":"","fx":"将史密斯机杆调整到一个高度，使您能够双脚平放在地面上且肩膀位于杆下方。\n将自己置于杠铃下方，双脚分开与肩同宽，脚趾向前。\n将双手放在横杆上以保持稳定。\n收紧小腿，慢慢将脚跟抬离地面，将身体抬起到脚趾上。\n在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/6MaEjVA.webp"},{"id":"jjUPrze","zh":"站姿史密斯实力推","en":"smith standing military press","bp":"肩","eq":"史密斯","tg":"三角肌前束","sec":"肱三头肌","fx":"双脚分开与肩同宽站立，膝盖稍微弯曲。\n正手握住杠铃，握距略宽于肩宽。\n将杠铃从架子上提起，并将其降至与肩同高，手掌朝前。\n向上推杠铃，直到手臂完全伸过头顶。\n在顶部停顿片刻，然后慢慢将杠铃放回至肩部水平。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/jjUPrze.webp"},{"id":"dzz6BiV","zh":"史密斯相扑深蹲","en":"smith sumo squat","bp":"股四头肌","eq":"史密斯","tg":"股四头肌","sec":"臀大肌下束","fx":"将杠铃置于臀部高度的史密斯机上。\n站立，双脚分开比肩宽，脚趾朝外。\n将自己置于杠铃下方，将其放在上背部和肩膀上。\n当你将身体降低到蹲姿时，收紧核心并保持挺胸，将臀部向后推并弯曲膝盖。\n放低身体，直到大腿与地面平行，或者尽可能低到您能舒服的高度。\n在底部停顿片刻，然后推动脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/dzz6BiV.webp"},{"id":"Y4QlY8z","zh":"坐姿史密斯提踵","en":"smith toe raise","bp":"小腿三头肌","eq":"史密斯","tg":"小腿三头肌","sec":"","fx":"将史密斯机杆调整到一个高度，让您可以舒适地站立，双脚平放在地面上。\n将自己置于杠铃下方，肩膀位于杠铃正下方，双脚分开与肩同宽。\n将脚掌放在升高的平台或重量板上，脚后跟悬在边缘。\n正手握住杠铃，握距略宽于肩宽。\n在整个练习过程中启动你的核心并保持背部挺直。\n慢慢地尽可能高地抬起脚后跟，将身体重量转移到脚掌上。\n在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/Y4QlY8z.webp"},{"id":"1DN3iz4","zh":"史密斯直立划船","en":"smith upright row","bp":"肩","eq":"史密斯","tg":"三角肌中","sec":"斜方肌、肱二头肌","fx":"双脚分开与肩同宽站立，面向史密斯机。\n正手握住杠铃，双手间距略宽于肩宽。\n保持背部挺直，核心肌群参与。\n将杠铃拉向下巴，用肘部引导。\n在顶部停顿片刻，然后慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/1DN3iz4.webp"},{"id":"zoOvPcx","zh":"史密斯宽握卧推","en":"smith wide grip bench press","bp":"胸","eq":"史密斯","tg":"胸大肌","sec":"肱三头肌","fx":"将史密斯机上的长凳调整到舒适的位置。\n躺在长凳上，双脚平放在地上。\n宽握距抓住杠铃，握距略宽于肩宽。\n松开杠铃并将其慢慢降低到胸部，保持肘部向两侧伸出。\n当杠铃触及胸部时暂停片刻。\n将杠铃推回到起始位置，完全伸展双臂。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/zoOvPcx.webp"},{"id":"wi2H9QX","zh":"下斜史密斯宽握卧推","en":"smith wide grip decline bench press","bp":"胸","eq":"史密斯","tg":"胸大肌中下部","sec":"肱三头肌","fx":"将下斜凳调整至所需角度。\n躺在长凳上，双脚固定在脚垫下。\n宽握距抓住杠铃，握距略宽于肩宽。\n松开杠铃并将其慢慢降低到胸部，保持肘部朝外。\n当杠铃触及胸部时暂停片刻。\n将杠铃推回到起始位置，完全伸展双臂。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/wi2H9QX.webp"},{"id":"dG5Smob","zh":"抓举拉","en":"snatch pull","bp":"","eq":"杠铃","tg":"爆发力/协调","sec":"","fx":"双脚分开与肩同宽站立，杠铃放在你面前的地面上。\n弯曲膝盖并以臀部为铰链，降低至下蹲位置，用正手握住杠铃。\n当你通过脚后跟将杠铃抬离地面时，保持背部挺直，挺胸，伸展臀部和膝盖。\n当杠铃到达臀部水平时，爆发性地将其向上拉，耸肩并将肘部向两侧拉高。\n当杠铃到达最高点时，迅速落到杠铃下方，将自己拉成深蹲位置。\n双臂完全伸展，膝盖弯曲，将杠铃举过头顶。\n伸展臀部和膝盖站起来，将杠铃保持在头顶上方。\n通过反向运动将杠铃降低回起始位置。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/dG5Smob.webp"},{"id":"JbC2iaV","zh":"坐姿脊柱伸展","en":"spine stretch","bp":"","eq":"自重","tg":"竖脊肌、腘绳肌","sec":"腘绳肌","fx":"坐在地上，双腿在身前伸展。\n将双手放在身后的地面上，手指指向身体。\n启动你的核心并慢慢向后倾斜，保持背部挺直。\n继续向后倾斜，直到感觉到脊柱被拉伸。\n保持伸展几秒钟，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"激活放松","risk":false,"img":"img/JbC2iaV.webp"},{"id":"9E25EOx","zh":"站姿徒手分腿蹲","en":"split squats","bp":"股四头肌","eq":"自重","tg":"股四头肌","sec":"臀大肌","fx":"双脚分开与肩同宽站立。\n一只脚向前迈出一步，并将其放在另一只脚前面约两英尺处。\n弯曲膝盖和臀部，降低身体，保持背部挺直。\n继续降低，直到前大腿与地面平行，后膝盖悬停在地面上方。\n暂停片刻，然后推动前脚跟回到起始位置。\n重复所需的重复次数，然后换腿并重复。","tp":"训练","risk":false,"img":"img/9E25EOx.webp"},{"id":"IMRsOCn","zh":"深蹲挺举","en":"squat jerk","bp":"肩,股四头肌,臀部,肱三头","eq":"杠铃","tg":"爆发力/协调/稳定","sec":"","fx":"首先将杠铃放在肩膀上，双脚分开与肩同宽。\n将身体降低至蹲姿，保持挺胸，膝盖位于脚趾上方。\n当你到达深蹲底部时，爆发性地用腿发力，并将杠铃推过头顶。\n当杠铃到达最高点时，迅速落入分体位置，一脚向前，一脚向后。\n双臂完全伸展，后膝盖稍微接触地面，将杠铃举过头顶。\n从分开的位置站起来，将双脚重新并拢。\n将杠铃放回肩膀处，然后重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/IMRsOCn.webp"},{"id":"T2fA5Ir","zh":"波速球深蹲","en":"squat on bosu ball","bp":"股四头肌","eq":"健身球","tg":"股四头肌","sec":"臀大肌","fx":"将博苏球平放在地上。\n双脚分开与肩同宽站立，将自己放在博苏球的顶部。\n弯曲膝盖和臀部，降低身体，就像坐回椅子上一样。\n保持挺胸，将体重放在脚后跟上。\n降低身体直到大腿与地面平行。\n暂停片刻，然后用力推动脚后跟，回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/T2fA5Ir.webp"},{"id":"xDh0lJr","zh":"站姿杠铃颈后推肩","en":"standing behind neck press","bp":"肩","eq":"杠铃","tg":"三角肌前束","sec":"肱三头肌","fx":"双脚分开与肩同宽站立，用正手握法将杠铃握在颈后。\n保持背部挺直，核心参与。\n伸展手臂，充分伸展肘部，将杠铃推过头顶。\n在顶部停顿片刻，然后慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/xDh0lJr.webp"},{"id":"qOKcgVP","zh":"站姿拉伸","en":"standing calves calf stretch","bp":"小腿三头肌,腘绳肌","eq":"自重","tg":"腘绳肌、小腿三头肌","sec":"","fx":"面朝墙壁或坚固物体站立，距离大约一臂远。\n将手放在与肩同高的墙壁或物体上。\n一只脚向后退一步，保持脚跟平放在地面上。\n稍微弯曲前膝盖并向前倾斜，保持后腿伸直。\n您应该感觉到小腿肌肉有拉伸感。\n保持拉伸 20-30 秒。\n在另一条腿上重复。","tp":"激活放松","risk":false,"img":"img/qOKcgVP.webp"},{"id":"1jXLYEw","zh":"站立侧身伸展","en":"standing lateral stretch","bp":"背","eq":"自重","tg":"背阔肌","sec":"腹斜肌","fx":"双脚分开与肩同宽站立，膝盖稍微弯曲。\n将双臂伸直至两侧，与地面平行。\n慢慢将上半身向一侧倾斜，感觉侧面和背阔肌有拉伸感。\n保持拉伸 15-30 秒。\n返回起始位置并在另一侧重复。\n重复所需的重复次数。","tp":"激活放松","risk":false,"img":"img/1jXLYEw.webp"},{"id":"KtRomty","zh":"站姿腹肌轮推出","en":"standing wheel rollerout","bp":"腹部","eq":"自重","tg":"腹肌、背、三头","sec":"髋屈肌","fx":"首先，站直，双脚分开与肩同宽，滚轮位于您的前方。\n弯腰，慢慢向前滚动轮子，保持背部挺直，核心肌群参与。\n继续向前滚动，直到感觉到腹肌拉伸并且身体尽可能伸展。\n暂停片刻，然后慢慢地将轮子向身体方向滚动，回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/KtRomty.webp"},{"id":"H1PESYI","zh":"固定单车骑行","en":"stationary bike run v. 3","bp":"股四头肌,腘绳肌,小腿三头肌","eq":"单车","tg":"心肺/有氧","sec":"股四头肌、腘绳肌、小腿腓肠肌","fx":"调整座椅高度和位置以确保正确对齐。\n将脚放在踏板上，并用带子（如果有）将其固定。\n以舒适的速度开始踩踏板。\n保持稳定的节奏并根据需要增加阻力。\n调动核心肌肉以保持稳定性和正确的姿势。\n继续踩踏板达到所需的锻炼时间。\n逐渐减小阻力并减速，然后完全停止。\n锻炼后伸展双腿并放松。","tp":"有氧","risk":false,"img":"img/H1PESYI.webp"},{"id":"a8VDgLw","zh":"固定单车行走","en":"stationary bike walk","bp":"","eq":"单车","tg":"心肺/有氧","sec":"股四头肌、腘绳肌、小腿腓肠肌","fx":"调整固定自行车上的座椅高度和位置，以确保正确对齐。\n将脚放在踏板上，并用带子（如果有）将其固定。\n以舒适的速度开始踩踏，保持背部挺直，核心参与。\n保持稳定的节奏，并根据需要增加阻力水平。\n继续踩踏您的有氧运动所需的持续时间。\n通过逐渐降低步速和阻力水平来冷静下来。\n锻炼后伸展腿部肌肉，以防止紧绷并促进恢复。","tp":"有氧","risk":false,"img":"img/a8VDgLw.webp"},{"id":"4GqRrAk","zh":"俯卧撑 超人式","en":"superman push-up","bp":"腹部","eq":"自重","tg":"腹部，胸大肌","sec":"背阔肌","fx":"从高位平板支撑开始，双手分开略宽于肩宽，双脚并拢。\n收紧核心，将身体降低到地面，保持肘部靠近身体两侧。\n当你降低身体时，同时将右臂和左腿抬离地面，笔直向外伸展。\n在顶部暂停片刻，然后放下手臂和腿，同时将自己推回起始位置。\n重复该动作，这次抬起左臂和右腿。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/4GqRrAk.webp"},{"id":"X3TCNEU","zh":"TRX腹部前推","en":"suspended abdominal fallout","bp":"腹部","eq":"TRX","tg":"腹肌","sec":"腹斜肌、髋屈肌","fx":"将悬挂训练器连接到高锚点并将带子调整至腰部高度。\n背对锚点站立，并握住手柄，双臂向前伸展。\n腰部向前倾，保持身体挺直，核心肌群参与。\n尽可能降低身体，同时保持腹肌的控制和紧张。\n在底部停顿片刻，然后慢慢抬起身体回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/X3TCNEU.webp"},{"id":"IaGQCrC","zh":"TRX俯卧撑","en":"suspended push-up","bp":"胸","eq":"TRX","tg":"胸大肌","sec":"肱三头肌","fx":"找到一个悬挂训练器并将其调整到合适的高度。\n背对锚点站立，并用正手握住手柄。\n双脚向前走，身体向前倾斜，直到悬架训练器支撑您的体重。\n保持身体从头到脚跟伸直，核心部位收紧，胸部朝手柄方向降低。\n推动你的胸部和手臂回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/IaGQCrC.webp"},{"id":"R1WYG5D","zh":"TRX悬浮卷腹","en":"suspended reverse crunch","bp":"腹部","eq":"TRX","tg":"腹肌","sec":"髋屈肌","fx":"悬挂在引体向上杆上，双臂完全伸展，手掌背向自己。\n收紧核心肌群，将膝盖抬向胸部，将骨盆卷向胸腔。\n在顶部暂停片刻，然后慢慢将膝盖放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/R1WYG5D.webp"},{"id":"4OaumBr","zh":"TRX自重划船","en":"suspended row","bp":"背","eq":"TRX","tg":"上背肌群","sec":"肱二头肌","fx":"将悬挂训练器设置在适当的高度。\n面向锚点站立，双脚分开与肩同宽。\n正手握住手柄，手掌相对。\n向后倾斜，保持身体挺直，脚后跟着地。\n将胸部拉向手柄，将肩胛骨挤压在一起。\n在顶部停顿片刻，然后慢慢降低回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/4OaumBr.webp"},{"id":"QpXqiq8","zh":"TRX保加利亚蹲","en":"suspended split squat","bp":"臀部,股四头肌","eq":"TRX","tg":"股四头肌、臀大肌","sec":"","fx":"背对悬吊训练器站立，双脚与肩同宽。\n向前伸展一条腿，将脚背放在悬吊训练器的脚托中。\n弯曲站立的腿，将身体降低到弓步位置，保持胸部向上，膝盖与脚趾对齐。\n推动脚后跟返回到起始位置。\n重复所需的重复次数，然后换腿。","tp":"训练","risk":false,"img":"img/QpXqiq8.webp"},{"id":"SP3hUez","zh":"俯卧游泳者踢腿","en":"swimmer kicks v. 2 (male)","bp":"腰部","eq":"自重","tg":"下背部（腰）","sec":"腘绳肌、臀大肌","fx":"脸朝下躺在垫子上，双臂伸过头顶。\n启动核心肌群，同时将胸部和腿部抬离地面。\n以扑动的动作上下踢腿，就像在游泳一样。\n继续踢所需的重复次数。\n将胸部和双腿放低至起始位置。","tp":"训练","risk":false,"img":"img/SP3hUez.webp"},{"id":"DQ0cqkT","zh":"凳上臂屈伸","en":"three bench dip","bp":"肱三头","eq":"自重","tg":"肱三头肌","sec":"三角肌","fx":"坐在长凳上，双手抓住边缘，手指指向前方。\n将臀部滑离长凳，用手支撑体重。\n弯曲肘部并降低身体，直到上臂与地面平行。\n将自己推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/DQ0cqkT.webp"},{"id":"oZjMu1t","zh":"翻轮胎","en":"tire flip","bp":"","eq":"轮胎","tg":"协调/爆发力","sec":"","fx":"双脚分开与肩同宽站立，面向轮胎。\n弯曲膝盖并以臀部为铰链，降低至蹲姿。\n向下伸手，用双手抓住轮胎的底部边缘，手指朝向您。\n调动你的臀部和腿部肌肉，并爆发性地推动你的腿，将轮胎抬离地面。\n当轮胎翻转时，用上半身的力量引导轮胎并保持控制。\n轮胎完全翻转后，迅速后退并重置姿势。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/oZjMu1t.webp"},{"id":"jQGwmxN","zh":"六角杠硬拉","en":"trap bar deadlift","bp":"股四头肌","eq":"杠铃","tg":"股四头肌、腘绳肌","sec":"臀大肌","fx":"双脚分开与肩同宽站立，将陷阱杆放在你面前的地面上。\n弯曲臀部和膝盖，降低身体高度，并用正手握住陷阱杆的手柄。\n当你开始通过伸展臀部和膝盖将陷阱杆抬离地面时，保持背部挺直，挺胸。\n当你举起时，专注于通过脚后跟发力，并在运动的最高点挤压臀部。\n弯曲臀部和膝盖，将陷阱杆放回地面，在整个运动过程中保持背部挺直。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/jQGwmxN.webp"},{"id":"X6C6i5Y","zh":"窄握双杠臂屈伸","en":"triceps dip","bp":"肱三头","eq":"自重","tg":"肱三头肌","sec":"三角肌","fx":"坐在长凳或椅子的边缘，双手抓住边缘，手指指向前方。\n将臀部滑离长凳，用手支撑体重。\n弯曲肘部，将身体放低至地面，保持背部靠近长凳。\n在底部暂停片刻，然后将自己推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/X6C6i5Y.webp"},{"id":"fSrPP6B","zh":"远固定三头臂屈伸","en":"triceps press","bp":"肱三头","eq":"自重","tg":"肱三头肌","sec":"","fx":"双脚分开与肩同宽站立，膝盖稍微弯曲。\n将双臂伸直在身前，与地面平行。\n弯曲肘部，将身体放低至地面，保持上臂靠近身体两侧。\n在底部暂停片刻，然后将自己推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/fSrPP6B.webp"},{"id":"BMMolZ3","zh":"卷腹","en":"tuck crunch","bp":"腹部","eq":"自重","tg":"腹肌","sec":"","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将双手放在脑后，肘部朝外。\n收紧腹肌，将肩胛骨抬离地面，将膝盖靠近胸部，同时将上半身卷向膝盖。\n在顶部停顿片刻，然后慢慢降低肩胛骨并将双腿伸展回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/BMMolZ3.webp"},{"id":"AX1kB0o","zh":"转体抬","en":"twist hip lift","bp":"","eq":"自重","tg":"","sec":"腹斜肌、腘绳肌","fx":"仰卧，膝盖弯曲，双脚平放在地上。\n将双手放在身体两侧以获得支撑。\n收紧臀部并将臀部抬离地面，从膝盖到肩膀形成一条直线。\n在保持臀部抬起的同时，将下半身扭转到右侧，使膝盖靠近地面。\n返回起始位置并向左侧重复扭转。\n继续交替扭转所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/AX1kB0o.webp"},{"id":"yT9tk17","zh":"举腿（女）","en":"twisted leg raise (female)","bp":"腹部","eq":"自重","tg":"腹斜肌","sec":"髋屈肌","fx":"平躺，双腿伸展，双臂放在身体两侧。\n弯曲膝盖，将双腿抬离地面，将它们拉向胸部。\n当你抬起双腿时，将臀部扭向一侧，将膝盖移向另一侧的肩膀。\n在顶部暂停片刻，然后慢慢将双腿放回起始位置。\n重复这个动作，这次将臀部扭到另一侧。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/yT9tk17.webp"},{"id":"p195zsJ","zh":"站姿体前屈","en":"two toe touch (male)","bp":"腘绳肌","eq":"自重","tg":"脊柱、腘绳肌","sec":"","fx":"双脚分开与肩同宽站立，双臂向两侧伸展。\n腰部向前弯曲，保持背部挺直，膝盖稍微弯曲。\n双手向下伸向脚趾，保持双腿伸直。\n在底部停顿片刻，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"激活放松","risk":false,"img":"img/p195zsJ.webp"},{"id":"ZNgOYQU","zh":"支撑收腿","en":"vertical leg raise (on parallel bars)","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌","fx":"悬挂在双杠上，双臂完全伸展，身体伸直。\n启动你的核心并将双腿抬起到你面前，保持伸直。\n继续抬起，直到双腿与地面平行或稍高。\n在顶部暂停片刻，然后慢慢将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ZNgOYQU.webp"},{"id":"rjtuP6X","zh":"椭圆机","en":"walk elliptical cross trainer","bp":"","eq":"椭圆机","tg":"心肺/有氧","sec":"","fx":"将椭圆机的阻力水平和倾斜度调整到您想要的设置。\n踩上机器的踏板并轻轻握住手柄。\n首先用脚向下压，然后将手柄拉向身体。\n继续这个动作，交替推和拉，以模拟行走或跑步动作。\n在整个练习过程中保持稳定的步伐并保持核心参与。\n继续进行有氧运动所需的持续时间。\n下车前逐渐降低机器的强度和速度。","tp":"有氧","risk":false,"img":"img/rjtuP6X.webp"},{"id":"IZVHb27","zh":"行走弓步","en":"walking lunge","bp":"臀部,股四头肌","eq":"自重","tg":"臀大肌、股四头肌","sec":"","fx":"双脚分开与肩同宽站立。\n右腿向前迈出一步，将身体降低至弓步位置。\n保持躯干直立，前膝与脚踝对齐。\n右脚蹬地，左脚向前，左腿呈弓步姿势。\n继续交替双腿向前行走，保持受控且稳定的步伐。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/IZVHb27.webp"},{"id":"rjiM4L3","zh":"上斜行走跑步机","en":"walking on incline treadmill","bp":"","eq":"跑步机","tg":"心肺/有氧","sec":"","fx":"将跑步机的倾斜度调整到您想要的强度。\n站在跑步机上，双脚分开与肩同宽。\n开始以舒适的步伐行走，确保保持正确的姿势。\n在整个练习过程中，调动核心肌肉并保持背部挺直。\n继续在倾斜跑步机上行走，完成有氧运动所需的时间。\n逐渐降低跑步机的坡度和速度，使其冷却后再停止。","tp":"有氧","risk":false,"img":"img/rjiM4L3.webp"},{"id":"j9Q5crt","zh":"行走台阶机","en":"walking on stepmill","bp":"","eq":"登山机","tg":"心肺/有氧","sec":"","fx":"将步进机调整到舒适的水平。\n走上机器，将双手放在扶手上以获得支撑。\n开始行走时，将一只脚放在台阶上，然后将另一只脚放在台阶上，双腿交替。\n保持直立姿势并锻炼核心肌肉。\n继续步行所需的时间或距离。\n当您对锻炼感到更加舒适时，逐渐增加强度或速度。\n完成练习后记得冷静下来并伸展身体。","tp":"有氧","risk":false,"img":"img/j9Q5crt.webp"},{"id":"Gk1r408" 肌","sec":"三角肌、核心","fx":"双脚分开与肩同宽站立，每只手各握一个重物。\n右脚向前迈出一步，将身体降低至弓步位置。\n当你向前冲时，向前和向上摆动重物，保持手臂伸直。\n用右脚推出并返回到起始位置，将重物向下摆动。\n用左脚重复上述动作，并继续交替双腿，完成所需的重复次数。","tp":"训练","risk":false,"img":"img/5WiFcYk.webp"},{"id":"HMzLjXx","zh":"负重引体向上","en":"weighted pull-up","bp":"背","eq":"杠铃片","tg":"背阔肌中下部","sec":"肱二头肌","fx":"正手握住引体向上杆，握距略宽于肩宽。\n悬挂在杠上，双臂完全伸展，身体伸直。\n收紧背部肌肉，将身体拉向杠铃杆，保持肘部靠近身体。\n继续拉，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/HMzLjXx.webp"},{"id":"fZFZ704","zh":"负重俄罗斯转体","en":"weighted russian twist","bp":"腹部","eq":"杠铃片","tg":"腹斜肌","sec":"髋屈肌","fx":"坐在地上，膝盖弯曲，双脚平放在地板上。\n双手握住重物球或健身球放在胸前。\n稍微向后倾斜，保持背部挺直，核心肌群参与。\n慢慢地将你的躯干向右扭转，将重物或药球拉向右侧的地板。\n暂停片刻，然后将躯干向左扭转，将重物或健身球拉向左侧的地板。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/fZFZ704.webp"},{"id":"WU9BLIs","zh":"负重转体俄罗斯","en":"weighted russian twist (legs up)","bp":"腹部","eq":"杠铃片","tg":"腹斜肌","sec":"髋屈肌","fx":"坐在地上，膝盖弯曲，双脚离开地面，保持双腿并拢。\n用双手将重物放在胸前，保持肘部稍微弯曲。\n稍微向后倾斜以锻炼核心肌肉。\n将躯干向右扭转，将重量移向右侧地面。\n暂停片刻，然后将躯干向左扭转，将重量转移到左侧地面。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/WU9BLIs.webp"},{"id":"0lQnxMZ","zh":"深蹲 负重","en":"weighted sissy squat","bp":"股四头肌","eq":"杠铃片","tg":"股四头肌","sec":"","fx":"双脚分开与肩同宽站立，脚趾稍微向外。\n用双手将重物放在胸前，或将杠铃放在上背部。\n保持挺胸，核心收紧，弯曲膝盖和臀部，慢慢降低身体。\n继续降低，直到大腿与地面平行或尽可能低。\n在底部停顿片刻，然后推动脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/0lQnxMZ.webp"},{"id":"JZuApnB","zh":"负重深蹲","en":"weighted squat","bp":"股四头肌","eq":"杠铃片","tg":"股四头肌","sec":"臀大肌","fx":"双脚分开与肩同宽站立，脚趾稍微向外。\n将重物放在胸前或肩膀上。\n收紧核心并保持挺胸，同时降低臀部和向后倾斜，就像坐在椅子上一样。\n降低直到大腿与地面平行，或者尽可能降低到您能舒服的高度。\n推动脚后跟站起来，在顶部挤压臀部。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/JZuApnB.webp"},{"id":"bZq4bwK","zh":"负重双杠臂屈伸","en":"weighted tricep dips","bp":"胸","eq":"杠铃片","tg":"胸大肌下束","sec":"三角肌前束","fx":"坐在长凳或椅子的边缘，双手抓住臀部旁边的边缘。\n将你的屁股从长凳前面滑下来，双腿在你面前伸展。\n保持背部靠近长凳，肘部稍微弯曲。\n弯曲肘部降低身体，直到上臂与地板平行。\n伸直手臂，将自己推回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/bZq4bwK.webp"},{"id":"NAgVB3t","zh":"卷腹轮","en":"wheel rollerout","bp":"腹部","eq":"自重","tg":"腹肌","sec" function bpCount(name){
  if(name==='全部') return EXERCISES.length;

}

function go(p,extra){S.page=p; if(extra)Object.assign(S,extra); save(); render();}

function render(){
  renderTabs();

  if(S.page==='today'){T.textContent='今日工作台';R.textContent='TYRWELL · 体尔健康';c.innerHTML=viewToday();}

  else if(S.page==='member'){const m=M(S.cur);T.textContent=m.name;R.textContent='身体档案';c.innerHTML=viewMember(m);}
  else if(S.page==='library'){T.textContent='动作库';R.textContent=EXERCISES.length+' 个标准动作';c.innerHTML=viewLibrary();}
  else if(S.page==='plan'){T.textContent='训练计划';R.textContent='排课 · 执行 · 记录';c.innerHTML=viewPlan();}
}

  return `<div class="scroll">${S.members.map(m=>`
  <div class="card mcard" onclick="go('member',{cur:'${m.id}'})">
    <div class="mava" style="background:${m.color}">${m.name[0]}</div>
    <div class="grow"><div class="mname">${m.name} <span style="font-size:11px;color:var(--dim);font-weight:400">${m.sex} · ${m.age}岁</span></div>
      <div class="mmeta">${m.goal}</div><div class="mmeta" style="margin-top:4px">最近训练 ${m.last}</div></div>
    <span class="arrow">›</span>
  </div>`).join('')}</div>`;
}
function viewMember(m){
  const pl=S.plans[m.id]||[];
  return `<div class="scroll">
  <div class="card"><div class="row">
    <div class="mava" style="background:${m.color};width:52px;height:52px;font-size:18px">${m.name[0]}</div>
    <div class="grow"><div class="mname" style="font-size:16px">${m.name}</div><div class="mmeta">${m.sex} · ${m.age}岁 · ${m.goal}</div></div>
  </div></div>
  <h3 class="sec">身体数据</h3>
  <div class="stats">
    <div class="stat"><div class="n">${m.body.height}<small>cm</small></div><div class="l">身高</div></div>
    <div class="stat"><div class="n">${m.body.weight}<small>kg</small></div><div class="l">体重</div></div>
    <div class="stat"><div class="n">${m.body.bf}<small>%</small></div><div class="l">体脂率</div></div>
  </div>
  <h3 class="sec">健康与限制 <span style="font-size:10px;color:var(--teal)">安全字段</span></h3>
  <div class="card">
    <div class="slot"><div class="time" style="width:56px;color:var(--dim);font-weight:400;font-size:11.5px">健康状况</div><div class="grow"><div class="nm" style="font-size:13px">${m.health.conditions}</div></div></div>
    <div class="slot"><div class="time" style="width:56px;color:var(--dim);font-weight:400;font-size:11.5px">手术史</div><div class="grow"><div class="nm" style="font-size:13px">${m.health.surgery}</div></div></div>
    <div class="slot"><div class="time" style="width:56px;color:var(--warn);font-weight:400;font-size:11.5px">禁忌</div><div class="grow"><div class="nm" style="font-size:13px;color:#a13b38">${m.health.injuries}</div></div></div>
    <div class="slot"><div class="time" style="width:56px;color:var(--dim);font-weight:400;font-size:11.5px">血压</div><div class="grow"><div class="nm" style="font-size:13px">${m.health.bp} · 用药：${m.health.med}</div></div></div>
  </div>
  <h3 class="sec">训练历史</h3>
  <div class="card">${m.history.map(h=>`<div class="slot"><div class="time" style="width:44px">${h.d}</div><div class="grow"><div class="nm" style="font-size:13px">${h.t}</div><div class="sub">${h.n}</div></div></div>`).join('')}</div>
  <h3 class="sec">当前计划 ${pl.length?'· '+pl.length+' 个动作':''}</h3>
  <div class="card">${pl.length?pl.map((p,i)=>`<div class="pitem"><div class="idx">${i+1}</div><div class="info"><div class="nm">${p.zh}</div><div class="cfg">${p.sets} 组 × ${p.reps} 次</div></div></div>`).join(''):'<div class="empty">还没排计划</div>'}</div>
  <div class="btnrow"><button class="btn ghost" onclick="go('members')">返回</button><button class="btn primary" onclick="go('library',{forMember:'${m.id}'})">排训练计划</button></div>
  </div>`;
}

/* ================= 动作库（参考图布局） ================= */
function viewLibrary(){
  const f=S.lib, all=libList();
  const pages=Math.max(1,Math.ceil(all.length/PER)), pg=Math.min(f.page,pages);
  const slice=all.slice((pg-1)*PER,pg*PER);
  const m=S.forMember?M(S.forMember):null;
  return `<div class="lib">
    <div class="lib-side">${BPS.map(b=>`<div class="side-item ${f.bp===b?'on':''}" onclick="setBP('${b}')">${b}<span class="n">${bpCount(b)}</span></div>`).join('')}</div>
    <div class="lib-main">
      <div class="lib-top">
        ${m?`<div style="background:#E7F3F1;border-radius:10px;padding:8px 10px;margin-bottom:9px;font-size:11.5px;color:#12615c"><b>正在为 ${m.name} 排计划</b> · ${m.health.injuries!=='无'?'⚠ '+m.health.injuries:'无特殊禁忌'} <span style="float:right;cursor:pointer;text-decoration:underline" onclick="finishPlan()">完成(${(S.plans[m.id]||[]).length})</span></div>`:''}
        <div class="search"><input id="kw" placeholder="搜索动作名字" value="${f.kw}" oninput="S.lib.kw=this.value;S.lib.page=1;save();render();refocus()"></div>
        <div class="eqchips">${EQS.map(e=>`<div class="eqchip ${f.eq===e?'on':''}" onclick="setEQ('${e}')">${e}</div>`).join('')}</div>
      </div>
      <div class="lib-body">
        <div class="cnt"><span>${f.bp==='全部'?'全部部位':f.bp} · ${all.length} 个动作</span><span>${pg}/${pages}</span></div>
        <div class="grid">
          ${slice.map(e=>`
            <div class="ex" onclick="openEx('${e.id}')">
              <div class="thumb">${e.img?`<img src="${e.img}" loading="lazy" alt="${e.zh}">`:''}</div>
              <span class="lb">讲解</span>${e.risk?'<span class="riskdot">!</span>':''}
              <div class="body"><div class="nm">${e.zh}</div><div class="meta">${e.eq||''}</div></div>
            </div>`).join('')}
        </div>
        ${pages>1?`<div class="pager"><button ${pg<=1?'disabled':''} onclick="setPage(${pg-1})">上一页</button><span>${pg} / ${pages}</span><button ${pg>=pages?'disabled':''} onclick="setPage(${pg+1})">下一页</button></div>`:''}
      </div>
    </div>
  </div>`;
}
function setBP(b){S.lib.bp=b;S.lib.page=1;save();render();}
function setEQ(e){S.lib.eq=e;S.lib.page=1;save();render();}
function setPage(p){S.lib.page=p;save();render();}
function refocus(){const e=document.getElementById('kw');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}}
function finishPlan(){go('plan');}

/* ================= 动作详情 ================= */
let curEx=null;
function openEx(id){
  curEx=EXERCISES.find(e=>e.id===id);
  const m=S.forMember?M(S.forMember):null;
  let warn='';
  if(m){
    const inj=m.health.injuries, zh=curEx.zh||'';
    if(inj.includes('膝')&&/(深蹲|跳|跑|箭步|提踵|蹲)/.test(zh))
      warn=`<div class="note red">⚠ <b>禁忌提示</b>：${m.name} 禁忌为「${inj}」，该动作涉及膝关节负荷，加入前请确认。</div>`;
    if(inj.includes('腰')&&/(硬拉|俯身|前屈|早安|划船|弯腰)/.test(zh))
      warn=`<div class="note red">⚠ <b>禁忌提示</b>：${m.name} 有腰椎间盘突出史，该动作涉及腰椎负荷。</div>`;
    if(m.health.bp&&parseInt(m.health.bp)>140)
      warn=`<div class="note red">⚠ <b>强度提示</b>：${m.name}（${m.health.bp}）血压偏高，控制强度。</div>`;
  }
  const bps=(curEx.bp||'').split(/[,，、;；]/).filter(Boolean).map(s=>`<span class="tg bp">${s.trim()}</span>`).join('');
  document.getElementById('sheetIn').innerHTML=`
    <div class="sheet-h">
      <div><div class="t">${curEx.zh}</div><div class="e">${curEx.en}</div></div>
      <button class="close" onclick="closeSheet()">✕</button>
    </div>
    <div class="demo">${curEx.img?`<img src="${curEx.img}" alt="${curEx.zh}">`:''}</div>
    <div class="tagrow">${bps}${curEx.eq?`<span class="tg">${curEx.eq}</span>`:''}${curEx.tp?`<span class="tg">${curEx.tp}</span>`:''}${curEx.risk?'<span class="tg rk">⚠ 高危</span>':''}</div>
    ${curEx.tg?`<h4>目标肌肉</h4><div style="font-size:12.5px;color:#33465c;line-height:1.7">${curEx.tg}</div>`:''}
    ${curEx.sec?`<h4>协同肌肉</h4><div style="font-size:12.5px;color:#33465c;line-height:1.7">${curEx.sec}</div>`:''}
    ${warn}
    <h4>动作规范</h4>
    <div class="steps">${(curEx.fx||'暂无讲解').split(/\n+/).filter(Boolean).map((s,i)=>`<div class="step"><div class="no">${i+1}</div><div>${s}</div></div>`).join('')}</div>
    ${m?`<div class="btnrow"><button class="btn primary" onclick="addToPlan()">加入 ${m.name} 的计划</button></div>`:''}
  `;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){document.getElementById('sheet').classList.remove('on');}
function addToPlan(){
  const m=S.forMember; if(!m||!curEx)return;
  S.plans[m]=S.plans[m]||[];
  if(S.plans[m].some(p=>p.id===curEx.id)){toast('已在计划中');return;}
  S.plans[m].push({id:curEx.id,zh:curEx.zh,sets:4,reps:12});
  save();closeSheet();toast('已加入计划');render();
}

/* ================= 计划 ================= */
function viewPlan(){
  const ids=Object.keys(S.plans).filter(k=>(S.plans[k]||[]).length);
  if(!ids.length) return `<div class="scroll"><div class="empty">还没有计划<br><br>去「会员」选一位 → 排训练计划</div>
    <div class="btnrow"><button class="btn primary" onclick="go('members')">去选会员</button></div></div>`;
  return `<div class="scroll">`+ids.map(mid=>{
    const m=M(mid),pl=S.plans[mid];
    return `<h3 class="sec">${m.name} <span style="font-size:10.5px;color:var(--dim)">${pl.length} 个动作</span></h3>
    <div class="card">${pl.map((p,i)=>`
      <div class="pitem"><div class="idx">${i+1}</div>
        <div class="info"><div class="nm">${p.zh}</div>
        <div class="cfg"><input value="${p.sets}" style="width:38px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;font-size:11px;text-align:center" onchange="upd('${mid}',${i},'sets',this.value)"> 组 ×
        <input value="${p.reps}" style="width:38px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;font-size:11px;text-align:center" onchange="upd('${mid}',${i},'reps',this.value)"> 次</div></div>
        <button class="del" onclick="rm('${mid}',${i})">✕</button></div>`).join('')}
      <div class="btnrow"><button class="btn ghost" onclick="go('library',{forMember:'${mid}'})">加动作</button><button class="btn teal" onclick="doRecord('${mid}')">完成打卡</button></div>
    </div>`;
  }).join('')+`</div>`;
}
function upd(mid,i,k,v){S.plans[mid][i][k]=v;save();}
function rm(mid,i){S.plans[mid].splice(i,1);save();render();toast('已删除');}
function doRecord(mid){
  const m=M(mid);
  S.records[mid]=S.records[mid]||[];
  const d='09-19';
  S.records[mid].push({date:d,items:S.plans[mid].map(p=>p.zh)});
  m.last=d; m.history.unshift({d:d,t:'训练执行 · '+S.plans[mid].length+'个动作',n:'已完成打卡'});
  save();render();toast('✓ 已记录，数据已沉淀');
}

render();
</script>
</body>
</html>
