<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYRWELL Coach · 教练工作台 原型V2</title>
<style>
:root{
  --navy:#0D294D; --navy2:#08192e; --blue:#188DAD; --teal:#26B0A8;
  --bg:#F2F4F7; --card:#FFFFFF; --line:#E4E8EE;
  --txt:#12253F; --dim:#7A8797; --warn:#D9534F; --ok:#2F9E6E;
  --sel:#EAF4F9;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#dfe4ea;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;min-height:100vh}
.phone{width:390px;height:844px;background:var(--bg);border-radius:38px;box-shadow:0 24px 60px rgba(13,41,77,.28);overflow:hidden;display:flex;flex-direction:column;position:relative;border:8px solid #0b1a2e}
.statusbar{height:34px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;flex-shrink:0}
.appbar{background:var(--navy);color:#fff;padding:10px 18px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.appbar .brand{display:flex;align-items:center;gap:9px}
.appbar .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.appbar .ttl{font-size:15px;font-weight:700;letter-spacing:.5px}
.appbar .role{font-size:10px;color:#9fc4d8;letter-spacing:1.5px;margin-top:1px}
.appbar .ava{width:30px;height:30px;border-radius:50%;background:#1b3c66;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8fd8d3;border:1px solid #2c5480}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;padding:14px}
.scroll::-webkit-scrollbar{width:0}
.tabbar{height:62px;background:#fff;border-top:1px solid var(--line);display:flex;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--dim);cursor:pointer;transition:.15s}
.tab.on{color:var(--navy);font-weight:700}
.tab .ic{font-size:19px;line-height:1}

/* ===== 动作库：左竖栏 + 右内容 ===== */
.lib{flex:1;display:flex;min-height:0}
.lib-side{width:88px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0}
.lib-side::-webkit-scrollbar{width:0}
.side-item{padding:13px 8px;font-size:12.5px;color:var(--dim);text-align:center;cursor:pointer;border-left:3px solid transparent;transition:.15s;line-height:1.3}
.side-item.on{color:var(--navy);font-weight:700;background:var(--sel);border-left-color:var(--navy)}
.side-item .n{font-size:9.5px;color:#b3bcc8;display:block;margin-top:2px}
.lib-main{flex:1;display:flex;flex-direction:column;min-width:0}
.lib-top{padding:10px 12px 8px;background:var(--bg)}
.search{display:flex;gap:7px;margin-bottom:9px}
.search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;outline:none;background:#fff}
.search input:focus{border-color:var(--teal)}
.eqchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.eqchips::-webkit-scrollbar{display:none}
.eqchip{font-size:11.5px;padding:5px 11px;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--dim);white-space:nowrap;cursor:pointer;transition:.15s}
.eqchip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.lib-body{flex:1;overflow-y:auto;padding:0 12px 16px}
.lib-body::-webkit-scrollbar{width:0}
.cnt{font-size:11px;color:var(--dim);margin:2px 0 9px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ex{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(13,41,77,.06);transition:.15s;position:relative}
.ex:active{transform:scale(.97)}
.ex .thumb{width:100%;aspect-ratio:1/1;background:#f7f9fb;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ex .thumb img{width:100%;height:100%;object-fit:contain}
.ex .lb{position:absolute;top:6px;left:6px;font-size:9px;background:rgba(24,141,173,.9);color:#fff;padding:1.5px 6px;border-radius:5px;font-weight:600}
.ex .body{padding:7px 8px 9px}
.ex .nm{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:31px}
.ex .meta{font-size:9.5px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riskdot{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:#FDECEC;color:var(--warn);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 4px;font-size:12px;color:var(--dim)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 13px;font-size:12px;color:var(--navy);cursor:pointer}
.pager button:disabled{opacity:.4}

/* 详情弹层 */
.sheet{position:absolute;inset:0;background:rgba(10,22,40,.5);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheet-in{background:#fff;width:100%;max-height:86%;border-radius:20px 20px 0 0;overflow-y:auto;padding:18px 18px 26px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.sheet-h .t{font-size:17px;font-weight:800;line-height:1.35}
.sheet-h .e{font-size:11.5px;color:var(--dim);margin-top:3px}
.close{border:none;background:#F0F3F7;width:28px;height:28px;border-radius:50%;font-size:15px;color:#5c6b7f;cursor:pointer;flex-shrink:0}
.demo{width:100%;height:210px;background:#f7f9fb;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.demo img{max-width:100%;max-height:100%;object-fit:contain}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.tg{font-size:10px;padding:2.5px 8px;border-radius:6px;background:#EEF2F7;color:#5c6b7f}
.tg.bp{background:#E7F3F1;color:var(--teal);font-weight:600}
.tg.rk{background:#FDECEC;color:var(--warn);font-weight:600}
h4{font-size:13px;color:var(--navy);margin:14px 0 7px;display:flex;align-items:center;gap:6px}
h4::before{content:'';width:3px;height:13px;background:var(--teal);border-radius:2px}
.steps{counter-reset:s}
.step{display:flex;gap:9px;font-size:12.5px;line-height:1.6;padding:6px 0;color:#33465c}
.step .no{width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-weight:700}
.note{background:#FFF8E8;border:1px solid #F2DFB0;border-radius:11px;padding:10px 12px;font-size:12px;color:#8a6a1f;line-height:1.6;margin-top:12px}
.note.red{background:#FDECEC;border-color:#F3C9C7;color:#a13b38}
.btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn.primary{background:var(--navy);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btnrow{display:flex;gap:9px;margin-top:14px}
.btnrow .btn{flex:1}

/* 通用卡片/页 */
h3.sec{font-size:13px;color:var(--dim);margin:16px 0 9px;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
h3.sec:first-child{margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(13,41,77,.06)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:4px}
.stat{background:#fff;border-radius:13px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(13,41,77,.06)}
.stat .n{font-size:21px;font-weight:800;color:var(--navy);line-height:1.2}
.stat .n small{font-size:11px;font-weight:600}
.stat .l{font-size:10.5px;color:var(--dim);margin-top:3px}
.slot{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.slot:last-child{border-bottom:none;padding-bottom:0}
.slot .time{font-size:12px;font-weight:700;color:var(--navy);width:44px;flex-shrink:0}
.slot .nm{font-size:13.5px;font-weight:600}
.slot .sub{font-size:11px;color:var(--dim);margin-top:2px}
.pill{font-size:10px;padding:2px 8px;border-radius:20px;flex-shrink:0;font-weight:600}
.pill.wait{background:#EAF4F9;color:var(--blue)}
.pill.risk{background:#FDECEC;color:var(--warn)}
.mcard{display:flex;gap:12px;align-items:center;cursor:pointer}
.mava{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.mname{font-size:14.5px;font-weight:700}
.mmeta{font-size:11.5px;color:var(--dim);margin-top:3px}
.arrow{color:#c3cbd6;font-size:16px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pitem:last-child{border-bottom:none}
.pitem .idx{width:22px;height:22px;border-radius:7px;background:#EEF2F7;color:var(--navy);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pitem .info{flex:1;min-width:0}
.pitem .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .cfg{font-size:11px;color:var(--dim);margin-top:2px}
.del{border:none;background:none;color:#c3cbd6;font-size:16px;cursor:pointer;padding:4px}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:34px 0}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(13,41,77,.93);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:80%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>TYRWELL Coach · V2</span><span>􀛨 􀙇 􀛪</span></div>
  <div class="appbar">
    <div class="brand"><div class="mark">T</div>
      <div><div class="ttl" id="appttl">今日工作台</div><div class="role" id="approle">TYRWELL · 体尔健康</div></div>
    </div>
    <div class="ava" id="ava">于</div>
  </div>
  <div class="content" id="content"></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>window.EXERCISES=[{"id":"2gPfomN","zh":"屈腿仰卧起坐","en":"3/4 sit-up","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将双手放在脑后，肘部朝外。\n收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。\n在顶部停顿片刻，然后慢慢将上半身放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/2gPfomN.webp"},{"id":"Hy9D21L","zh":"山羊凳体侧屈","en":"45° side bend","bp":"腹部","eq":"自重","tg":"侧腹","sec":"腹斜肌","fx":"双脚分开与肩同宽站立，双臂在身体两侧笔直向下伸展。\n保持背部挺直，核心肌群参与，慢慢将躯干向一侧弯曲，将手向膝盖方向放低。\n在底部停顿片刻，然后慢慢回到起始位置。\n在另一侧重复。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/Hy9D21L.webp"},{"id":"1ZFqTDN","zh":"自行车转体卷腹","en":"air bike","bp":"腹部","eq":"自重","tg":"下腹","sec":"髋屈肌","fx":"平躺，双手放在脑后。\n将双腿抬离地面，并以 90 度角弯曲膝盖。\n将右肘靠近左膝盖，同时伸直右腿。\n返回起始位置，在另一侧重复该动作，将左肘拉向右膝盖，同时伸直左腿。\n继续交替进行蹬踏动作，达到所需的重复次数。","tp":"训练","risk":false,"img":"img/1ZFqTDN.webp"},{"id":"qBcKorM","zh":"四肢跪地伸展","en":"all fours squad stretch","bp":"股四头肌","eq":"自重","tg":"股四头肌","sec":"腘绳肌、臀大肌","fx":"从四肢着地开始，双手直接放在肩膀下方，膝盖直接放在臀部下方。\n将一条腿向后伸直，保持膝盖弯曲和脚弯曲。\n慢慢地将臀部降低到地面，感觉股四头肌的伸展。\n保持这个姿势20-30秒。\n换腿并在另一侧重复拉伸。","tp":"激活放松","risk":false,"img":"img/qBcKorM.webp"},{"id":"qaZVsGk","zh":"交替触踵卷腹","en":"alternate heel touchers","bp":"腹部","eq":"自重","tg":"腹肌","sec":"腹斜肌","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将双臂伸直至两侧，与地面平行。\n收紧腹肌，将肩膀抬离地面，并将右手伸向右脚跟。\n返回起始位置并在左侧重复，将左手伸向左脚跟。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/qaZVsGk.webp"},{"id":"4IKbhHV","zh":"‌交替单臂高位下拉","en":"alternate lateral pulldown","bp":"背","eq":"器械（钢线）","tg":"背阔肌","sec":"肱二头肌","fx":"坐在缆绳机上，背部挺直，双脚平放在地面上。\n正手握住手柄，握距略宽于肩宽。\n稍微向后倾斜，将手柄拉向胸部，将肩胛骨挤压在一起。\n在动作的最高点暂停片刻，然后慢慢松开手柄回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/4IKbhHV.webp"},{"id":"72BC5Za","zh":"弓箭手引体向上","en":"archer pull up","bp":"背","eq":"自重","tg":"背阔肌","sec":"肱二头肌、前臂","fx":"首先，用正手握法悬挂在引体向上杆上，握距略宽于肩宽。\n启动你的核心并将肩胛骨向下拉和向后拉。\n当你站起来时，弯曲一只手臂并将肘部移向身体一侧，同时保持另一只手臂伸直。\n继续拉，直到下巴位于杠铃上方并且弯曲的手臂完全弯曲。\n有控制地放低自己，伸直弯曲的手臂并在另一侧重复该动作。\n每次重复时交替进行。","tp":"训练","risk":false,"img":"img/72BC5Za.webp"},{"id":"A9qxk2F","zh":"弓箭手俯卧撑","en":"archer push up","bp":"胸","eq":"自重","tg":"胸肌","sec":"肱三头肌、核心肌群","fx":"从俯卧撑位置开始，双手分开略宽于肩宽。\n将一只手臂伸直至一侧，与地面平行。\n弯曲肘部降低身体，保持背部挺直，核心参与。\n推回到起始位置。\n在另一侧重复上述步骤，将另一只手臂伸出到一侧。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/A9qxk2F.webp"},{"id":"uWpxD4v","zh":"悬垂屈膝举腿","en":"arm slingers hanging bent knee legs","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌","fx":"悬挂在引体向上杆上，双臂完全伸展，膝盖弯曲成 90 度角。\n收紧核心并将膝盖抬向胸部，尽可能靠近肘部。\n慢慢地将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/uWpxD4v.webp"},{"id":"PXTIwgu","zh":"悬垂举腿","en":"arm slingers hanging straight legs","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌","fx":"悬挂在引体向上杆上，双臂完全伸展，双腿伸直向下。\n启动你的核心并将双腿抬起到你面前，直到它们与地面平行。\n在顶部保持片刻，然后慢慢将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/PXTIwgu.webp"},{"id":"RtyAsy1","zh":"动态拉伸","en":"arms apart circular toe touch (male)","bp":"腘绳肌","eq":"自重","tg":"腘绳肌","sec":"背部","fx":"双脚分开与肩同宽站立，双臂向两侧伸展。\n保持双腿伸直，腰部向前弯曲，右手向下伸向脚趾。\n当你向下伸展时，同时将左腿在身后伸直，保持平衡。\n返回起始位置，重复该动作，左手伸向脚趾，右腿在身后抬起。\n继续交替进行所需的重复次数。","tp":"激活放松","risk":false,"img":"img/RtyAsy1.webp"},{"id":"NAkmgdx","zh":"臂过顶仰卧起坐","en":"arms overhead full sit-up (male)","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将手臂伸过头顶，保持伸直。\n收紧腹肌，慢慢将上半身抬离地面，向前卷曲直到躯干直立。\n在顶部停顿片刻，然后慢慢将上半身放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/NAkmgdx.webp"},{"id":"PAgTVaK","zh":"跪姿助力双杠臂屈伸","en":"assisted chest dip (kneeling)","bp":"肱三头","eq":"器械（钢线）","tg":"胸肌、肱三头肌","sec":"三角肌前","fx":"将机器调整到您想要的高度，并将膝盖固定在垫子上。\n手掌朝下，抓住手柄，双臂完全伸展。\n弯曲肘部降低身体，直到上臂与地板平行。\n暂停片刻，然后将自己推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/PAgTVaK.webp"},{"id":"GxDwDX0","zh":"仰卧腿腓肠肌拉伸","en":"assisted lying calves stretch","bp":"小腿三头肌","eq":"自重","tg":"小腿腓肠肌","sec":"腘绳肌，比目鱼肌","fx":"仰卧，双腿伸展。\n弯曲一侧膝盖，将脚平放在地上。\n用手或毛巾轻轻地将脚趾拉向身体，感受小腿的拉伸。\n保持拉伸 20-30 秒。\n松开拉伸并在另一条腿上重复。","tp":"激活放松","risk":false,"img":"img/GxDwDX0.webp"},{"id":"yn0LjwL","zh":"仰卧辅助臀肌拉伸","en":"assisted lying glutes stretch","bp":"臀部","eq":"自重","tg":"臀大肌","sec":"腘绳肌","fx":"仰卧，双腿伸展。\n弯曲右膝盖，将右脚踝放在左大腿上，就在膝盖上方。\n用双手抓住左大腿，轻轻地将其拉向胸部。\n保持拉伸 20-30 秒。\n松开并在另一侧重复。","tp":"激活放松","risk":false,"img":"img/yn0LjwL.webp"},{"id":"RQNVT10","zh":"仰卧辅助臀肌梨状肌拉伸","en":"assisted lying gluteus and piriformis stretch","bp":"臀部","eq":"自重","tg":"梨状肌","sec":"臀大肌","fx":"仰卧，双腿伸展。\n弯曲右膝盖，将右脚踝放在左大腿上，就在膝盖上方。\n用双手抓住左大腿，轻轻地将其拉向胸部。\n保持拉伸 20-30 秒。\n松开拉伸并在另一侧重复。","tp":"激活放松","risk":false,"img":"img/RQNVT10.webp"},{"id":"UGhRD1A","zh":"仰卧旋转举腿下放","en":"assisted lying leg raise with lateral throw down","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌、腹斜肌","fx":"平躺，双腿伸展，双臂放在身体两侧。\n将双手放在臀部下方以获得支撑。\n收紧腹肌，将双腿抬离地面，保持伸直。\n双腿并拢的同时，将它们降低到一侧，直到离地几英寸。\n暂停片刻，然后抬起双腿回到起始位置。\n到另一侧重复该动作。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/UGhRD1A.webp"},{"id":"r7cT9YD","zh":"俄罗斯转体抛球","en":"assisted motion russian twist","bp":"腹部","eq":"自重","tg":"腹肌、","sec":"腹斜肌","fx":"坐在地上，膝盖弯曲，双脚平放在地板上。\n双手将健身球放在胸前。\n稍微向后倾斜，收紧腹肌并保持背部挺直。\n慢慢地将你的躯干向右扭转，将健身球移向身体的右侧。\n暂停片刻，然后将躯干向左扭转，将健身球移向身体左侧。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/r7cT9YD.webp"},{"id":"vrhHa6D","zh":"窄对握助力引体向上","en":"assisted parallel close grip pull-up","bp":"背","eq":"器械（钢线）","tg":"背阔肌","sec":"肱二头肌、前臂","fx":"将机器调整到您想要的重量和高度。\n将双手紧紧握在双杠上，手掌相对。\n悬挂在杠上，双臂完全伸展，双脚离开地面。\n收紧背部肌肉，将身体拉向杠铃，保持肘部靠近身体。\n继续拉，直到下巴高于杠铃。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/vrhHa6D.webp"},{"id":"YUYAMEj","zh":"俯卧辅助股四头肌拉伸","en":"assisted prone lying quads stretch","bp":"股四头肌","eq":"自重","tg":"股四头肌","sec":"腘绳肌、臀大肌","fx":"脸朝下躺在地上，双腿伸直。\n弯曲左膝，用左手向后抓住左脚或脚踝。\n轻轻地将左脚拉向臀肌，感受左股四头肌的拉伸。\n保持拉伸 20-30 秒，然后放松。\n右腿重复上述动作。","tp":"激活放松","risk":false,"img":"img/YUYAMEj.webp"},{"id":"2Ryn564","zh":"俯卧辅助髂腰肌拉伸","en":"assisted prone rectus femoris stretch","bp":"腹部","eq":"自重","tg":"髂腰肌","sec":"股四头肌","fx":"脸朝下躺在地上，双腿伸直。\n弯曲右膝，用右手向后伸抓住右脚或脚踝。\n轻轻地将右脚或脚踝拉向臀部，感受右大腿前部的拉伸。\n保持拉伸 20-30 秒。\n松开并在另一侧重复。","tp":"激活放松","risk":false,"img":"img/2Ryn564.webp"},{"id":"kiJ4Z2K","zh":"引体向上（助力）","en":"assisted pull-up","bp":"背","eq":"器械（钢线）","tg":"背阔肌","sec":"肱二头肌","fx":"将机器调整至您所需的体重和高度设置。\n正手握住手柄，握距略宽于肩宽。\n双臂完全伸展，双脚离开地面。\n收紧背部肌肉，将身体拉向手柄，保持肘部靠近身体。\n继续拉，直到下巴位于手柄上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/kiJ4Z2K.webp"},{"id":"RoV1Rfa","zh":"坐姿健身球辅助胸大肌拉伸","en":"assisted seated pectoralis major stretch with stability ball","bp":"胸","eq":"健身球","tg":"胸肌","sec":"三角肌","fx":"坐在稳定球上，双脚平放在地面上，背部挺直。\n双手握住稳定球，并将双臂伸直至身前。\n慢慢地将稳定球降低到胸部，感受胸肌的拉伸。\n保持伸展几秒钟，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"激活放松","risk":false,"img":"img/RoV1Rfa.webp"},{"id":"hC6oYY5","zh":"侧卧辅助内收肌拉伸","en":"assisted side lying adductor stretch","bp":"内收肌","eq":"自重","tg":"大腿内收肌","sec":"腘绳肌、臀大肌","fx":"侧躺，双腿伸直并叠放在一起。\n稍微弯曲下面的腿以保持稳定。\n将上脚放在稳定的表面上，例如长凳或台阶上。\n保持上腿伸直，慢慢将其降低到地面，感觉大腿内侧有拉伸感。\n保持拉伸 20-30 秒。\n返回起始位置并在另一侧重复。","tp":"激活放松","risk":false,"img":"img/hC6oYY5.webp"},{"id":"7OeHptV","zh":"站姿助力反手引体","en":"assisted standing chin-up","bp":"背","eq":"器械（钢线）","tg":"背阔肌","sec":"肱二头肌、前臂","fx":"将机器调整至您所需的辅助级别。\n站在脚踏板上，正手握住手柄，握距略宽于肩宽。\n保持挺胸、肩膀向后，收紧核心肌群，并稍微弯曲膝盖。\n弯曲肘部并将肘部向身体两侧压低，将身体向上拉。\n继续拉，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/7OeHptV.webp"},{"id":"f4xtKBj","zh":"站姿助力引体向上","en":"assisted standing pull-up","bp":"背","eq":"器械（钢线）","tg":"背阔肌","sec":"肱二头肌、前臂","fx":"将机器调整至您所需的体重和高度设置。\n面向机器站立，双脚分开与肩同宽。\n正手握住手柄，握距略宽于肩宽。\n启动你的背阔肌和二头肌，并将自己拉向手柄。\n在顶部暂停片刻，挤压背部肌肉。\n慢慢地将自己放回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/f4xtKBj.webp"},{"id":"7HcfMBP","zh":"站姿辅助三头屈伸","en":"assisted standing triceps extension (with towel)","bp":"肱三头","eq":"杠铃","tg":"肱三头肌","sec":"","fx":"双脚分开与肩同宽站立，双手握住毛巾放在脑后。\n保持肘部靠近耳朵，上臂保持静止。\n慢慢向上伸展前臂，在顶部挤压三头肌。\n暂停片刻，然后慢慢将毛巾放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/7HcfMBP.webp"},{"id":"PnZJIrk","zh":"跪姿助力宽握臂屈伸","en":"assisted wide-grip chest dip (kneeling)","bp":"胸","eq":"器械（钢线）","tg":"胸肌","sec":"肱三头肌、三角肌","fx":"将机器调整到您想要的高度，并将膝盖固定在垫子上。\n宽握手柄并保持肘部稍微弯曲。\n弯曲肘部降低身体，直到上臂与地板平行。\n伸展双臂，将自己推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/PnZJIrk.webp"},{"id":"f9lVSSI","zh":"站姿开合跳","en":"astride jumps (male)","bp":"","eq":"自重","tg":"心肺/有氧","sec":"股四头肌、腘绳肌、小腿腓肠肌","fx":"双脚分开与肩同宽站立。\n弯曲膝盖并将身体降低至蹲姿。\n爆发性向上跳跃，伸展双腿和手臂。\n在空中时，将双腿分开，并将双臂向两侧伸出。\n双脚分开与肩同宽，轻轻落地，弯曲膝盖以吸收冲击力。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/f9lVSSI.webp"},{"id":"qLpO4vV","zh":"健身球背部屈伸","en":"back extension on exercise ball","bp":"腰部","eq":"健身球","tg":"下腰","sec":"臀大肌、腘绳肌","fx":"将稳定球放在地面上，面朝下躺在上面，臀部放在球上，双脚靠在墙壁或其他稳定的表面上。\n将双手放在脑后或交叉在胸前。\n启动你的核心，慢慢地将你的上半身抬离球，伸展你的背部，直到你的身体从头部到脚后跟形成一条直线。\n在顶部停顿片刻，然后慢慢将上半身放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/qLpO4vV.webp"},{"id":"chfnQnM","zh":"背部胸肌伸展","en":"back pec stretch","bp":"背","eq":"自重","tg":"背阔肌","sec":"胸肌","fx":"站直，双脚分开与肩同宽。\n将双臂伸直在身前，与地面平行。\n双臂交叉在身体前方，右臂放在左臂上方。\n手指交叉，手掌旋转远离身体。\n慢慢抬起手臂并远离身体，感觉背部和胸部有拉伸感。\n保持拉伸 15-30 秒，然后放松。\n在另一侧重复。","tp":"激活放松","risk":false,"img":"img/chfnQnM.webp"},{"id":"3omWx6P","zh":"弹力带交替肱二头弯举","en":"band alternating biceps curl","bp":"肱二头","eq":"弹力带","tg":"肱二头肌","sec":"前臂","fx":"双脚分开与肩同宽站立，反手握住弹力带，手掌朝上。\n保持肘部靠近身体两侧，慢慢地将一只手臂向肩膀弯曲，在顶部挤压二头肌。\n将手臂放回起始位置，然后用另一只手臂重复此动作。\n继续交替手臂进行所需的重复次数。","tp":"训练","risk":false,"img":"img/3omWx6P.webp"},{"id":"ztAa1RK","zh":"仰卧弹力带交替触脚","en":"band alternating v-up","bp":"腹部","eq":"弹力带","tg":"腹肌","sec":"髋屈肌","fx":"平躺，双腿伸直，手臂伸过头顶，握住弹力带。\n收紧腹肌，同时将双腿和上半身抬离地面，将双手伸向脚趾。\n当你降低双腿和上半身时，交换双腿的位置，将一条腿交叉在另一条腿上。\n重复该动作，每次重复时交替变换双腿的位置。\n继续进行所需的重复次数。","tp":"训练","risk":false,"img":"img/ztAa1RK.webp"},{"id":"r1XNRYB","zh":"弹力带助力引体向上","en":"band assisted pull-up","bp":"背","eq":"弹力带","tg":"背阔肌","sec":"肱二头肌、前臂","fx":"将弹力带固定在上拉杆或坚固的锚点上。\n踏上弹力带，手掌背向自己，握住杠铃，双手之间的距离略宽于肩宽。\n双臂完全伸展，保持核心收紧，肩膀向下并向后倾斜。\n将肩胛骨挤压在一起并将肘部向下推向臀部，将身体向上拉向杠铃杆。\n继续拉，直到下巴高于杠铃，然后慢慢降低回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/r1XNRYB.webp"},{"id":"zhF9lW4","zh":"跪姿弹力带辅助腹肌轮推出","en":"band assisted wheel rollerout","bp":"腹部","eq":"弹力带","tg":"腹部","sec":"髋屈肌","fx":"跪在地板上，双手握住弹力带的手柄，手掌朝下。\n将弹力带放在您面前的地面上，双手分开与肩同宽。\n启动你的核心并缓慢地向前滚动轮子，在保持控制的同时尽可能地伸展你的身体。\n在最远点暂停片刻，然后慢慢地将轮子向膝盖方向滚动，回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/zhF9lW4.webp"},{"id":"khlHMqs","zh":"弹力带卧推","en":"band bench press","bp":"胸","eq":"弹力带","tg":"胸肌","sec":"肱三头肌、三角肌","fx":"平躺在长凳上，双脚平放在地上，背部紧贴长凳。\n正手握住带子手柄，间距略宽于肩宽。\n充分伸展双臂，将弹力带推离胸部。\n慢慢将弹力带放回到胸部，保持肘部呈 90 度角。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/khlHMqs.webp"},{"id":"wSScovH","zh":"俯身弹力带髋伸","en":"band bent-over hip extension","bp":"臀部","eq":"弹力带","tg":"臀大肌","sec":"下背肌群","fx":"将带子固定在脚踝高度的坚固锚点上。\n背对锚点站立，双脚与肩同宽。\n向后退一步，在弹力带上产生张力，保持膝盖稍微弯曲。\n铰接臀部并向前倾斜，保持脊柱中立。\n将右腿向后伸直，在顶部挤压臀部。\n将右腿放回原位，然后换左腿重复此动作。\n继续交替双腿达到所需的重复次数。","tp":"训练","risk":false,"img":"img/wSScovH.webp"},{"id":"tZkGYZ9","zh":"弹力带自行车卷腹","en":"band bicycle crunch","bp":"腹部","eq":"弹力带","tg":"腹肌","sec":"髋屈肌、腹斜肌","fx":"平躺，双手放在脑后，膝盖弯曲。\n将脚抬离地面，将右膝盖靠近胸部，同时扭转躯干，将左肘靠近右膝盖。\n伸直右腿，同时将左膝靠近胸部，并扭转躯干，使右肘靠近左膝。\n继续交替扭转运动，就像踩自行车一样，同时在整个运动过程中保持核心参与。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/tZkGYZ9.webp"},{"id":"ufaxB52","zh":"弹力带夹肘俯卧撑","en":"band close-grip push-up","bp":"肱三头","eq":"弹力带","tg":"肱三头肌","sec":"胸肌、三角肌","fx":"将一条带子绕在你的上臂上，就在肘部上方。\n采取俯卧撑姿势，双手直接放在肩膀下方，身体从头到脚跟呈一条直线。\n弯曲肘部，将胸部降低到地面，保持肘部靠近身体两侧。\n推动手掌以伸展手臂并返回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ufaxB52.webp"},{"id":"sTg7iys","zh":"弹力带前侧平举","en":"band front lateral raise","bp":"肩","eq":"弹力带","tg":"三角肌中","sec":"斜方肌","fx":"双脚分开与肩同宽站立，将弹力带放在大腿前面，手掌朝下。\n保持双臂伸直，将弹力带举到身前，直到双臂与地面平行。\n在顶部暂停片刻，然后慢慢将弹力带放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/sTg7iys.webp"},{"id":"TFA88iB","zh":"直臂前平举（弹力带）","en":"band front raise","bp":"肩","eq":"弹力带","tg":"三角肌前","sec":"肱三头肌、上背肌群","fx":"双脚分开与肩同宽站立，将弹力带放在大腿前面，手掌朝下。\n保持手臂伸直，慢慢向前举起，直到与地面平行。\n在顶部暂停片刻，然后慢慢将手臂放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/TFA88iB.webp"},{"id":"E4R8Hz1","zh":"弹力带臀桥","en":"band hip lift","bp":"臀部","eq":"弹力带","tg":"臀大肌","sec":"腘绳肌","fx":"仰卧，膝盖弯曲，双脚平放在地上。\n将阻力带放在膝盖上方。\n调动你的臀肌和核心肌肉。\n将脚后跟压入地面，将臀部抬离地板，在顶部挤压臀部。\n在顶部暂停片刻，然后慢慢将臀部放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/E4R8Hz1.webp"},{"id":"225x2Vd","zh":"跪姿弹力带旋转卷腹","en":"band kneeling twisting crunch","bp":"腹部","eq":"弹力带","tg":"腹肌","sec":"腹斜肌","fx":"将带子固定在腰部高度的坚固锚点上。\n面向远离锚点的方向跪下，用双手握住弹力带，保持肘部弯曲并靠近身体两侧。\n收紧腹肌，慢慢地将躯干扭向一侧，将双手移向另一侧的臀部。\n暂停片刻，然后慢慢回到起始位置。\n在另一侧重复。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/225x2Vd.webp"},{"id":"vIICElP","zh":"弹力带俯卧髋内旋","en":"band lying hip internal rotation","bp":"臀部","eq":"弹力带","tg":"髋内旋肌","sec":"腘绳肌、股四头肌","fx":"仰卧，双腿伸直，将阻力带绕在脚上。\n弯曲膝盖并将其靠近胸部，双脚并拢。\n慢慢向外旋转膝盖，使膝盖彼此远离，同时保持双脚并拢。\n旋转结束时暂停片刻，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"激活放松","risk":false,"img":"img/vIICElP.webp"},{"id":"arsYEd3","zh":"弹力带单腿箭步蹲","en":"band one arm single leg split squat","bp":"股四头肌,臀部","eq":"弹力带","tg":"股四头肌、臀部","sec":"臀大肌、腘绳肌","fx":"双脚分开站立，与臀部同宽，将阻力带绕在脚踝上。\n向前伸出一条腿，将脚尖放在长凳上或身后的一步上。\n用一只手握住支撑物以保持平衡。\n弯曲站立的腿，将身体降低到蹲姿，保持膝盖与脚趾在一条直线上。\n推动脚后跟返回到起始位置。\n重复所需的重复次数，然后换腿。","tp":"训练","risk":false,"img":"img/arsYEd3.webp"},{"id":"km0sQC0","zh":"站姿弹力带单臂低划船","en":"band one arm standing low row","bp":"背","eq":"弹力带","tg":"背阔肌","sec":"肱二头肌","fx":"将带子固定在腰部高度的稳定锚点上。\n面向锚点站立，双脚分开与肩同宽。\n用一只手握住弹力带，手掌朝内，然后后退以在弹力带中产生张力。\n稍微弯曲膝盖，髋部向前转动，保持背部挺直。\n将带子拉向腰部，将肩胛骨挤压在一起。\n在动作的最高点暂停片刻，然后慢慢松开弹力带回到起始位置。\n重复所需的重复次数，然后换边。","tp":"训练","risk":false,"img":"img/km0sQC0.webp"},{"id":"DKBwJrL","zh":"坐姿弹力带单臂旋转划船","en":"band one arm twisting seated row","bp":"背","eq":"弹力带","tg":"背阔肌","sec":"肱二头肌","fx":"坐在长凳或椅子上，双脚平放在地上，背部挺直。\n用一只手握住弹力带，并将手臂完全伸到身前。\n保持背部挺直，弯曲肘部并将肩胛骨挤压在一起，将弹力带拉向身体。\n同时，将躯干向拉动手臂的一侧扭转。\n在顶部暂停片刻，然后慢慢释放弹力带的张力并返回到起始位置。\n重复所需的重复次数，然后换到另一只手臂。","tp":"训练","risk":false,"img":"img/DKBwJrL.webp"},{"id":"VtTbiP3","zh":"站姿弹力带臀冲","en":"band pull through","bp":"臀部","eq":"弹力带","tg":"臀大肌","sec":"腘绳肌","fx":"将阻力带连接到地面上坚固的锚点上。\n背对锚点站立，双脚与肩同宽。\n向前迈一步，在弹力带中产生张力，保持膝盖稍微弯曲。\n铰接臀部并将臀部向后推，保持膝盖轻微弯曲。\n降低躯干直到与地面平行，感觉腿筋被拉伸。\n向前推动臀部并挤压臀部以返回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/VtTbiP3.webp"},{"id":"sTfvVsG","zh":"弹力带反向飞鸟","en":"band reverse fly","bp":"肩","eq":"弹力带","tg":"三角肌后","sec":"上背肌群、斜方肌","fx":"将带子固定在胸部高度的固定物体上。\n双脚分开与肩同宽站立，双手握住弹力带放在身前。\n保持手臂伸直并将其向两侧抬起，直到与地面平行。\n在动作的最高点将肩胛骨挤压在一起。\n慢慢地将手臂放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/sTfvVsG.webp"},{"id":"9gbyYKk","zh":"坐姿弹力带髋内旋","en":"band seated hip internal rotation","bp":"臀部","eq":"弹力带","tg":"髋内旋肌","sec":"腘绳肌、股四头肌","fx":"坐在椅子或长凳上，背部挺直，双脚平放在地面上。\n在大腿周围、膝盖上方放置一条阻力带。\n保持膝盖弯曲 90 度，双脚分开与肩同宽。\n收紧臀肌，慢慢向外旋转膝盖，克服弹力带的阻力。\n动作结束时暂停片刻，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"激活放松","risk":false,"img":"img/9gbyYKk.webp"},{"id":"S1JXDAG","zh":"坐姿弹力带转体","en":"band seated twist","bp":"腹部","eq":"弹力带","tg":"腹斜肌","sec":"腹斜肌","fx":"坐在地上，双腿向前伸展，背部挺直。\n将带子绕在腰上，并用双手握住两端。\n收紧腹肌，慢慢将躯干扭向一侧，保持背部挺直，双脚着地。\n扭转结束时暂停片刻，然后慢慢回到起始位置。\n重复扭转到另一侧。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/S1JXDAG.webp"},{"id":"peAeMR3","zh":"弹力带肩推举","en":"band shoulder press","bp":"肩","eq":"弹力带","tg":"三角肌前","sec":"肱三头肌、","fx":"双脚分开与肩同宽站立，将弹力带放在脚下。\n手掌朝前握住弹力带，将双手举至肩高，肘部弯曲。\n将弹力带压过头顶，充分伸展双臂。\n在顶部暂停片刻，然后慢慢将阻力带降低至肩部高度。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/peAeMR3.webp"},{"id":"trmte8s","zh":"弹力带耸肩","en":"band shrug","bp":"斜方肌","eq":"弹力带","tg":"斜方肌","sec":"三角肌","fx":"双脚分开与肩同宽站立，将弹力带放在脚下，用手握住两端。\n保持手臂伸直并放松，让弹力带悬挂在大腿前面。\n向上耸肩，尽可能高地举起弹力带，以启动斜方肌。\n保持收缩一会儿，然后慢慢将肩膀放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/trmte8s.webp"},{"id":"9JprnPh","zh":"弹力带单腿提踵","en":"band single leg calf raise","bp":"小腿三头肌","eq":"弹力带","tg":"小腿三头肌","sec":"比目鱼肌","fx":"双脚分开站立，与臀部同宽，将弹力带绕在左脚掌上。\n如果需要，请抓住一个稳定的物体以保持平衡。\n慢慢地将左脚跟抬离地面，将身体重量转移到脚掌上。\n在顶部暂停片刻，然后慢慢将左脚跟放回起始位置。\n重复所需的重复次数，然后换右腿。","tp":"训练","risk":false,"img":"img/9JprnPh.webp"},{"id":"QsSQWbf","zh":"弹力带单腿反向提踵","en":"band single leg reverse calf raise","bp":"胫骨前肌","eq":"弹力带","tg":"筋骨前肌","sec":"","fx":"双脚分开站立，与臀部同宽，将弹力带放在脚掌周围。\n抓住稳定的物体以保持平衡。\n慢慢地将脚跟抬离地面，将身体重量转移到脚掌上。\n在顶部暂停片刻，然后慢慢将脚跟放回起始位置。\n重复所需的重复次数，然后换另一条腿。","tp":"训练","risk":false,"img":"img/QsSQWbf.webp"},{"id":"TUZLh71","zh":"深蹲（弹力带）","en":"band squat","bp":"臀部,股四头肌","eq":"弹力带","tg":"臀大肌，股四头肌","sec":"股四头肌、腘绳肌、小腿腓肠肌","fx":"双脚分开站立，与肩同宽，弹力带放在膝盖上方。\n保持挺胸、核心收紧，将臀部向后推，弯曲膝盖，形成下蹲姿势。\n确保膝盖位于脚趾上方，并且重量位于脚后跟。\n在底部停顿片刻，然后推动脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/TUZLh71.webp"},{"id":"tc5dYrf","zh":"站姿弹力带开肘划船","en":"band standing rear delt row","bp":"肩","eq":"弹力带","tg":"三角肌后","sec":"肱二头肌","fx":"双脚分开与肩同宽站立，将弹力带放在脚下。\n双手握住弹力带手柄，手掌相对，双臂向前伸展。\n稍微弯曲膝盖，髋部向前转动，保持背部挺直。\n将弹力带拉向胸部，将肩胛骨挤压在一起。\n在最高点停顿片刻，然后慢慢释放张力，回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/tc5dYrf.webp"},{"id":"kuMiR2T","zh":"直腿硬拉（弹力带）","en":"band stiff leg deadlift","bp":"腘绳肌","eq":"弹力带","tg":"腘绳肌","sec":"腘绳肌、下背肌群","fx":"双脚分开站立，与肩同宽，将弹力带绕在脚踝上。\n用双手将弹力带放在大腿前面，手掌朝向身体。\n保持背部挺直，核心收紧，铰接臀部，慢慢将上半身降低到地面。\n当你降低时，将臀部向后推，并让膝盖稍微弯曲。\n将弹力带降低至地面，感受腿筋的拉伸。\n在底部暂停片刻，然后启动臀肌和腿筋，将上半身抬回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/kuMiR2T.webp"},{"id":"u4bAmKp","zh":"站姿弹力带旋转过顶推举","en":"band twisting overhead press","bp":"肩","eq":"弹力带","tg":"三角肌","sec":"肱三头肌","fx":"双脚分开与肩同宽站立，将弹力带放在脚下。\n将弹力带手柄保持在与肩同高的位置，手掌朝前。\n启动你的核心并将弹力带压过头顶，充分伸展你的手臂。\n当你按压时，将你的躯干扭转到一侧，保持臀部稳定。\n在顶部暂停片刻，然后回到起始位置。\n在另一侧重复按压和扭转。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/u4bAmKp.webp"},{"id":"jl6uxZV","zh":"弹力带提踵","en":"band two legs calf raise - (band under both legs) v. 2","bp":"小腿三头肌","eq":"弹力带","tg":"小腿三头肌","sec":"比目鱼肌","fx":"双脚分开与肩同宽站立，并将阻力带放在双脚下方。\n用手握住带子的末端以保持稳定。\n用小腿将脚跟抬离地面，尽可能高。\n在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/jl6uxZV.webp"},{"id":"k6tUeqS","zh":"弹力带正握下拉","en":"band underhand pulldown","bp":"背","eq":"弹力带","tg":"背阔肌","sec":"肱二头肌、前臂","fx":"将弹力带固定在较高的锚点上，例如上拉杆或坚固的横梁。\n面向锚点站立，双脚分开与肩同宽。\n反手握住弹力带，双手间距略宽于肩宽。\n将手臂完全伸过头顶，保持肘部稍微弯曲。\n收紧背阔肌，将弹力带向下拉向胸部，将肩胛骨挤压在一起。\n在动作底部停顿片刻，然后慢慢释放张力，回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/k6tUeqS.webp"},{"id":"H6ETwO9","zh":"弹力带两头起","en":"band v-up","bp":"腹部","eq":"弹力带","tg":"腹肌","sec":"髋屈肌","fx":"平躺，双腿伸直，手臂伸过头顶，握住弹力带。\n收紧腹肌，同时将双腿和上半身抬离地面，双手伸向脚趾。\n在顶部停顿片刻，然后慢慢放下双腿和上半身回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/H6ETwO9.webp"},{"id":"vUTfFHw","zh":"弹力带腕弯举","en":"band wrist curl","bp":"小臂","eq":"弹力带","tg":"小臂屈肌","sec":"","fx":"坐在长凳或椅子上，双脚平放在地面上。\n双手握住弹力带，手掌朝上，前臂放在大腿上。\n慢慢向上弯曲手腕，挤压前臂。\n在顶部暂停片刻，然后慢慢将手腕放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/vUTfFHw.webp"},{"id":"aHDy5O5","zh":"站姿弹力带全幅前平举","en":"band y-raise","bp":"肩","eq":"弹力带","tg":"三角肌前","sec":"斜方肌","fx":"双脚分开与肩同宽站立，将弹力带放在大腿前面，手掌朝内。\n保持双臂伸直，将其向上举至两侧，与身体形成“Y”形。\n在动作的最高点将肩胛骨挤压在一起。\n慢慢地将手臂放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/aHDy5O5.webp"},{"id":"Yza7XrQ","zh":"杠铃交替肱二头弯举","en":"barbell alternate biceps curl","bp":"肱二头","eq":"杠铃","tg":"肱二头肌","sec":"前臂","fx":"站直，双脚分开与肩同宽，每只手握住一个杠铃，手掌朝前。\n保持上臂静止，在弯举哑铃时呼气，同时收缩二头肌。\n继续举起杠铃，直到二头肌完全收缩并且杠铃与肩部齐平。\n挤压二头肌时，保持收缩位置短暂停顿。\n吸气，慢慢开始将杠铃放回起始位置。\n重复所需的重复次数，交替手臂。","tp":"训练","risk":false,"img":"img/Yza7XrQ.webp"},{"id":"Y7YcmIJ","zh":"杠铃颈前深蹲","en":"barbell bench front squat","bp":"股四头肌","eq":"杠铃","tg":"股四头肌","sec":"臀大肌","fx":"首先站立，双脚分开与肩同宽，将杠铃放在上胸部，锁骨下方。\n正手握住杠铃，保持肘部向上，上臂与地面平行。\n弯曲膝盖和臀部，将身体降低到蹲姿，保持背部挺直，挺胸。\n在深蹲底部暂停片刻，然后用脚后跟恢复到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/Y7YcmIJ.webp"},{"id":"EIeI8Vf","zh":"平板卧推（杠铃）","en":"barbell bench press","bp":"胸","eq":"杠铃","tg":"胸肌","sec":"肱三头肌、三角肌","fx":"平躺在长凳上，双脚平放在地上，背部紧贴长凳。\n正手握住杠铃，握距略宽于肩宽。\n将杠铃从架子上提起，并将其直接放在胸部上方，双臂完全伸展。\n将杠铃慢慢降低到胸部，保持肘部内收。\n当杠铃触及胸部时暂停片刻。\n伸展双臂，将杠铃推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/EIeI8Vf.webp"},{"id":"W9pFVv1","zh":"杠铃凳深蹲","en":"barbell bench squat","bp":"股四头肌,臀部","eq":"杠铃","tg":"股四头肌","sec":"臀大肌","fx":"将杠铃放在深蹲架上，与胸部同高。\n背对架子站立，双脚与肩同宽。\n弯曲膝盖，将身体降低至蹲姿，保持背部挺直，挺胸。\n正手握住杠铃，握距略宽于肩宽。\n将杠铃从架子上提起并向后退一步，确保双脚仍与肩同宽。\n降低身体蹲下，保持膝盖与脚趾在一条线上。\n在底部停顿片刻，然后推动脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/W9pFVv1.webp"},{"id":"cA9FuWG","zh":"仰卧杠铃臂屈伸","en":"barbell bent arm pullover","bp":"肱三头","eq":"杠铃","tg":"肱三头肌","sec":"","fx":"平躺在长凳上，头放在一端，双脚放在地板上。\n握距与肩同宽，握住杠铃，将手臂伸直至胸部上方。\n将杠铃放在脑后，同时保持手臂稍微弯曲。\n暂停片刻，然后将杠铃举回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/cA9FuWG.webp"},{"id":"eZyBC3j","zh":"俯身划船（杠铃）","en":"barbell bent over row","bp":"背","eq":"杠铃","tg":"背阔肌中上部","sec":"肱二头肌","fx":"站立，双脚分开与肩同宽，膝盖稍微弯曲。\n臀部向前弯曲，同时保持背部挺直、挺胸。\n正手握住杠铃，双手间距略宽于肩宽。\n通过收缩肩胛骨并挤压背部肌肉，将杠铃拉向下胸部。\n在顶部停顿片刻，然后慢慢将杠铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/eZyBC3j.webp"},{"id":"SGY8Zui","zh":"高翻接推肩","en":"barbell clean and press","bp":"臀部,肩,腘绳肌" "训练","risk":false,"img":"img/s0HKO2I.webp"},{"id":"gscGLOU","zh":"侧卧屈腿两头起","en":"bodyweight side lying biceps curl","bp":"腹部","eq":"自重","tg":"侧腹部","sec":"前臂","fx":"侧躺，双腿伸直，用手臂支撑头部。\n将上臂靠在身体两侧，弯曲肘部，将前臂卷向肩膀。\n在顶部暂停片刻，然后慢慢将前臂放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/gscGLOU.webp"},{"id":"bJYHBIN","zh":"站姿提踵（自重）","en":"bodyweight standing calf raise","bp":"小腿三头肌","eq":"自重","tg":"小腿三头肌","sec":"","fx":"双脚分开与肩同宽站立，脚趾指向前方。\n将手放在墙壁或稳定的表面上以保持平衡。\n慢慢地将脚后跟抬离地面，将身体重量转移到脚掌上。\n在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/bJYHBIN.webp"},{"id":"9c6T1YX","zh":"原地交叉登山","en":"bridge - mountain climber (cross body)","bp":"腹部","eq":"自重","tg":"腹肌","sec":"臀大肌、股四头肌、腘绳肌、三角肌、肱三头肌","fx":"从高平板支撑位置开始，双手直接放在肩膀下方，身体呈一条直线。\n启动你的核心并将右脚抬离地面，将右膝移向左肘。\n将右脚放回到起始位置，然后将左脚朝向右肘重复该动作。\n继续交替两侧，以受控的速度移动。\n保持臀部水平，避免臀部抬得太高或下垂得太低。\n在整个练习过程中保持稳定的呼吸模式。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/9c6T1YX.webp"},{"id":"dK9394r","zh":"波比跳","en":"burpee","bp":"","eq":"自重","tg":"心肺/有氧","sec":"股四头肌、腘绳肌、小腿腓肠肌、三角肌、胸肌","fx":"从站立位置开始，双脚分开与肩同宽。\n弯曲膝盖并将双手放在身前的地板上，将身体降低至蹲姿。\n将脚踢回到俯卧撑位置。\n进行俯卧撑，保持身体呈一条直线。\n将双脚跳回蹲姿。\n爆发性地跳起，将双臂举过头顶。\n轻轻落地并立即回到蹲姿，开始下一次重复。","tp":"多关节动作","risk":false,"img":"img/dK9394r.webp"},{"id":"qcNN2FN","zh":"肘撑起桥卷腹","en":"butt-ups","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌、肩部","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将双手放在身体两侧，掌心朝下。\n收紧腹肌，将双腿抬离地面，将膝盖靠近胸部。\n在动作的最高点，挤压腹肌并暂停片刻。\n慢慢地将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/qcNN2FN.webp"},{"id":"KHPZL0b","zh":"绳索交替肩推举","en":"cable alternate shoulder press","bp":"肩","eq":"器械（钢线）","tg":"三角肌","sec":"肱三头肌","fx":"双脚分开与肩同宽站立，并用正手握住绳索机的手柄。\n将双手放在与肩同高的位置，手掌朝前。\n保持核心参与并保持背部挺直。\n向上并向前按下一个手柄，直到您的手臂完全伸展。\n在最高点暂停片刻，然后慢慢将手柄放回起始位置。\n用另一只手臂重复上述步骤。\n双臂交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/KHPZL0b.webp"},{"id":"Gchi5Tr","zh":"站姿钢线单手颈后臂屈伸","en":"cable alternate triceps extension","bp":"肱三头","eq":"器械（钢线）","tg":"肱三头肌","sec":"","fx":"面对电缆机站立，双脚与肩同宽。\n右手握住电缆手柄，抬起手臂，使上臂与地面平行，肘部弯曲成 90 度角。\n保持上臂静止，前臂向后伸展，完全伸直手臂。\n暂停片刻，然后慢慢回到起始位置。\n用左臂重复此动作。\n继续交替手臂进行所需的重复次数。","tp":"训练","risk":false,"img":"img/Gchi5Tr.webp"},{"id":"eYnzaCm","zh":"高位下拉","en":"cable bar lateral pulldown","bp":"背","eq":"器械（钢线）","tg":"背阔肌","sec":"肱二头肌、菱形肌、后三角肌","fx":"将电缆滑轮调整至较高位置并安装直杆。\n面向缆绳机坐着，双脚平放在地面上，膝盖稍微弯曲。\n正手握住杠铃，握距略宽于肩宽。\n稍微向后倾斜，挺胸，保持下背部轻微的拱形。\n将杠铃向下拉向胸部，用肘部引导并将肩胛骨挤压在一起。\n在动作底部暂停片刻，然后慢慢地将杠铃返回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/eYnzaCm.webp"},{"id":"7xI5MXA","zh":"仰卧龙门架推胸","en":"cable bench press","bp":"胸","eq":"器械（钢线）","tg":"胸肌","sec":"肱三头肌、三角肌","fx":"将绳索机调整至胸部高度并安装手柄。\n背对机器站立，双脚与肩同宽。\n正手握住手柄并向前迈一步，以在电缆中产生张力。\n将双脚牢牢放在地面上并启动核心。\n弯曲肘部，将双手置于肩部水平，保持肘部呈 90 度角。\n向前推动手柄，将双臂完全伸展到身前。\n暂停片刻，然后慢慢扭转动作，将双手放回肩部水平。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/7xI5MXA.webp"},{"id":"Db7eEgw","zh":"跪姿单手钢线臂屈伸","en":"cable concentration extension (on knee)","bp":"肱三头","eq":"器械（钢线）","tg":"肱三头肌","sec":"","fx":"坐在长凳或椅子上，膝盖弯曲，双脚平放在地上。\n用右手握住电缆手柄，并将肘部放在右膝盖内侧。\n充分伸展手臂，保持肘部静止并靠近膝盖。\n在顶部停顿片刻，然后慢慢将手臂放回起始位置。\n重复所需的重复次数，然后换边。","tp":"训练","risk":false,"img":"img/Db7eEgw.webp"},{"id":"OQ1otBN","zh":"站姿绳索交叉下拉","en":"cable cross-over lateral pulldown","bp":"肩","eq":"器械（钢线）","tg":"三角肌后","sec":"菱形肌","fx":"将电缆手柄连接到电缆机器两侧与肩同高的位置。\n站在机器中间，双脚分开与肩同宽。\n正手握住手柄并后退以在电缆中产生张力。\n从臀部开始稍微向前倾，保持背部挺直，挺胸。\n将手柄向下拉并穿过身体，将肩胛骨挤压在一起。\n在动作底部暂停片刻，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/OQ1otBN.webp"},{"id":"aqvSOQE","zh":"附身龙门架反飞鸟","en":"cable cross-over revers fly","bp":"肩","eq":"器械（钢线）","tg":"三角肌后","sec":"菱形肌","fx":"将 D 形手柄连接到每根低滑轮电缆上，并站在电缆交叉机的中间。\n旋前抓住手柄（手掌朝下），向前迈出一步，双脚分开与肩同宽。\n稍微弯曲膝盖，腰部前倾，保持背部挺直，腹部收紧。\n双臂向两侧伸展，肘部稍微弯曲，呼气并将肩胛骨挤压在一起，同时以反向飞翔动作向后和向上拉动绳索。\n在收缩峰值时停顿片刻，然后吸气，慢慢回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/aqvSOQE.webp"},{"id":"0CXGHya","zh":"龙门架十字夹胸（变式）","en":"cable cross-over variation","bp":"胸","eq":"器械（钢线）","tg":"胸大肌下束","sec":"三角肌前束","fx":"将电缆滑轮调整至胸部高度。\n站在电缆机的中央，一只脚在另一只脚前面。\n手掌朝下抓住手柄，手臂向两侧伸展。\n向前迈出一步，保持手臂稍微弯曲。\n肘部稍微弯曲，双手并拢放在胸前。\n暂停片刻，然后慢慢将手臂放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/0CXGHya.webp"},{"id":"G08RZcQ","zh" :"img/mTT3KLn.webp"},{"id":"HPlPoQA","zh":"绳索锤式弯举","en":"cable hammer curl (with rope)","bp":"肱二头","eq":"器械（钢线）","tg":"肱二头肌、肱桡肌","sec":"前臂","fx":"站直，双脚分开与肩同宽，膝盖稍微弯曲。\n双手握住缆绳附件，手掌相对，手臂完全伸展。\n保持上臂静止，呼气并弯举哑铃，同时收缩二头肌。\n继续提升缆绳附件，直到您的二头肌完全收缩并且绳索与肩部齐平。\n挤压二头肌时，保持收缩位置短暂停顿。\n吸气并慢慢开始将缆绳附件降低回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/HPlPoQA.webp"},{"id":"ZSJNetl","zh":"跪姿绳索高划船","en":"cable high row (kneeling)","bp":"背","eq":"器械（钢线）","tg":"上背部","sec":"肱二头肌","fx":"将直杆连接到胸部高度的缆绳机上。\n跪在缆绳机前，用正握方式抓住杠铃，双手与肩同宽。\n坐在脚后跟上，保持背部挺直，核心肌群参与。\n将杠铃拉向上腹部，将肩胛骨挤压在一起。\n在动作的最高点暂停片刻，然后慢慢松开杠铃回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ZSJNetl.webp"},{"id":"hBGWILP","zh":"绳索髋内收","en":"cable hip adduction","bp":"内收肌","eq":"器械（钢线）","tg":"大腿内收肌","sec":"臀大肌、股四头肌","fx":"将脚踝套戴到脚踝上，面向电缆机站立。\n将自己放置在距离机器足够远的位置，以便电缆上有张力。\n将手放在机器上以获得支撑。\n保持腿伸直，慢慢将腿移向身体中线。\n动作结束时暂停片刻，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/hBGWILP.webp"},{"id":"Vh0GsK4","zh":"绳索上斜卧推","en":"cable incline bench press","bp":"胸","eq":"器械（钢线）","tg":"胸肌上束","sec":"三角肌前束、肱三头肌","fx":"将长凳调整至 45 度倾斜。\n将电缆手柄连接到高滑轮上。\n坐在长凳上，面向电缆机，双脚平放在地面上。\n正手握住手柄，并将其拉至肩部高度。\n向前和向上推动手柄，直到手臂完全伸展。\n暂停片刻，然后慢慢将手柄放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/Vh0GsK4.webp"},{"id":"yaMIo4D","zh":"上斜绳索夹肘划船","en":"cable incline bench row","bp":"背","eq":"器械（钢线）","tg":"背部中部","sec":"肱二头肌、后三角肌","fx":"以 45 度角设置一个上斜凳，并将绳索手柄连接到低滑轮上。\n坐在长凳上，面向电缆机，双脚平放在地板上，膝盖稍微弯曲。\n正手握住电缆手柄，并将双臂完全伸展到身前。\n从臀部开始向前倾，同时保持背部挺直，核心肌群参与。\n缩回肩胛骨并弯曲肘部，将电缆手柄拉向胸部。\n在动作的最高点挤压背部肌肉，然后慢慢伸展手臂回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/yaMIo4D.webp"},{"id":"tBWXbIT","zh":"上斜绳索飞鸟","en":"cable incline fly","bp":"胸","eq":"器械（钢线）","tg":"胸肌上束","sec":"三角肌前束","fx":"将电缆机调整至较低位置并安装手柄。\n坐在倾斜的长凳上，背部靠在垫子上，双脚平放在地板上。\n正手握住手柄，并将双臂伸直至身前。\n保持肘部轻微弯曲，以受控的动作向两侧张开双臂。\n在完全伸展位置停顿片刻，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/tBWXbIT.webp"},{"id":"27NNGFr","zh":"上斜瑜伽球上绳索飞鸟","en":"cable incline fly (on stability ball)","bp":"胸","eq":"器械（钢线）","tg":"胸肌上束","sec":"三角肌","fx":"以倾斜角度设 :"背阔肌中下","sec":"肱二头肌","fx":"用狭窄的平行握距悬挂在引体向上杆上，手掌朝向您。\n收紧背部肌肉，将身体拉向杠铃杆，保持肘部靠近身体。\n继续拉，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/G70mEAJ.webp"},{"id":"wigSg76","zh":"击掌俯卧撑","en":"clap push up","bp":"胸","eq":"自重","tg":"胸大肌","sec":"肱三头肌","fx":"从高平板支撑位置开始，双手分开略宽于肩宽。\n弯曲肘部，将身体降低到地面，保持核心参与。\n爆发性地推动手掌，将身体推离地面。\n在半空中时，拍手，然后回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/wigSg76.webp"},{"id":"CMAxnsG","zh":"俯卧撑","en":"clock push-up","bp":"胸","eq":"自重","tg":"胸大肌","sec":"肱三头肌","fx":"从高平板支撑位置开始，双手直接放在肩膀下方，身体呈一条直线。\n弯曲肘部，使肘部靠近身体两侧，将身体降低到地面。\n当你下降时，将你的身体向左旋转，将你的左臂伸直到侧面。\n向上推回到起始位置，同时将身体旋转到中心。\n重复俯卧撑，这次将身体向右旋转，并将右臂向侧面伸出。\n每次重复时继续交替进行。","tp":"训练","risk":false,"img":"img/CMAxnsG.webp"},{"id":"VnfUNW7","zh":"窄握引体向上","en":"close grip chin-up","bp":"背","eq":"自重","tg":"背阔肌中下","sec":"肱二头肌","fx":"抓住引体向上杆，手掌朝向自己，双手与肩同宽。\n悬挂在杠上，双臂完全伸展，双脚离开地面。\n收紧背部肌肉，将身体拉向杠铃杆，保持肘部靠近身体。\n继续拉，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/VnfUNW7.webp"},{"id":"x6KpKpq","zh":"窄距俯卧撑","en":"close-grip push-up","bp":"肱三头","eq":"自重","tg":"肱三头肌","sec":"胸肌、三角肌","fx":"从高位平板支撑开始，双手并拢，位于肩膀正下方。\n收紧核心，将身体降低到地面，保持肘部靠近身体两侧。\n推动手掌以伸展手臂并返回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/x6KpKpq.webp"},{"id":"v3vLFW0","zh":"跪姿窄距俯卧撑","en":"close-grip push-up (on knees)","bp":"肱三头","eq":"自重","tg":"肱三头肌","sec":"胸肌、三角肌","fx":"首先双手和膝盖着地，双手与肩同宽，膝盖与臀部同宽。\n弯曲肘部，将上身压向地面，使其靠近身体两侧。\n当你的胸部刚好高于地面时，暂停片刻。\n推动手掌以伸直手臂并返回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/v3vLFW0.webp"},{"id":"SLKj2pX","zh":"蚕式卷腹","en":"cocoons","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将双手放在脑后，肘部朝外。\n收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。\n在顶部停顿片刻，然后慢慢将上半身放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/SLKj2pX.webp"},{"id":"rbu5UUb","zh":"空中单车转体","en":"cross body crunch","bp":"腹部","eq":"自重","tg":"腹肌","sec":"腹斜肌","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将双手放在脑后，肘部朝外。\n收紧腹肌，将上半身抬离地面，然后扭转，使右肘靠近左膝盖。\n在顶部停顿片刻，然后慢慢将上半身放回起始位置。\n在另一侧重复，将左肘靠近右膝盖。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/rbu5UUb.webp"},{"id":"kjJ3VoQ","zh":"过顶直臂卷腹","en":"crunch (hands overhead)","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将双臂伸直至头顶上方。\n收紧腹肌，将上半身抬离地面，向前向膝盖弯曲。\n在顶部停顿片刻，然后慢慢将上半身放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/kjJ3VoQ.webp"},{"id":"MCUhf1F","zh":"瑜伽球上卷腹","en":"crunch (on stability ball)","bp":"腹部","eq":"健身球","tg":"腹肌","sec":"髋屈肌","fx":"坐在稳定球上，双脚平放在地面上，膝盖弯曲成 90 度角。\n仰卧在球上，直到下背部得到支撑并且上半身与地板平行。\n将双手放在脑后或放在胸前。\n收紧腹肌，将上身抬向膝盖，躯干向前卷曲。\n在动作的最高点暂停片刻，然后慢慢将上半身放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/MCUhf1F.webp"},{"id":"Sn8wxAI","zh":"瑜伽球上直臂卷腹","en":"crunch (on stability ball, arms straight)","bp":"腹部","eq":"健身球","tg":"腹肌","sec":"髋屈肌，核心","fx":"坐在稳定球上，双脚平放在地面上，膝盖弯曲成 90 度角。\n仰卧在球上，直到下背部得到支撑并且上半身与地板平行。\n将双手放在脑后或交叉放在胸前。\n收紧腹肌，将上半身抬离球，将肩膀向臀部弯曲。\n在顶部停顿片刻，然后慢慢将上半身放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/Sn8wxAI.webp"},{"id":"gUjqdei","zh":"屈膝礼箭步蹲","en":"curtsey squat","bp":"臀部","eq":"自重","tg":"臀大肌、股四头肌","sec":"股四头肌、腘绳肌、小腿腓肠肌","fx":"双脚分开与肩同宽站立。\n右脚向斜后方跨出一步，跨过身体，交叉在左腿后面。\n弯曲双膝，就像行屈膝礼一样，将身体降低到地面。\n保持躯干直立，将体重放在前脚上。\n推动前脚返回起始位置。\n在另一侧重复，用左脚斜向后方跨过身体。","tp":"训练","risk":false,"img":"img/gUjqdei.webp"},{"id":"XSCHmiI","zh":"风阻自行车","en":"cycle cross trainer","bp":"臀部,股四头肌,腘绳肌","eq":"单车","tg":"心肺/有氧、臀大肌","sec":"股四头肌、腘绳肌、臀大肌","fx":"调整座椅高度并将自己放在自行车交叉训练机上。\n将脚放在踏板上并抓住车把。\n开始以平稳且受控的动作踩踏。\n保持稳定的步伐并根据需要增加阻力。\n继续踩踏您的有氧运动所需的持续时间。","tp":"有氧","risk":false,"img":"img/XSCHmiI.webp"},{"id":"iny3m5y","zh":"死虫式","en":"dead bug","bp":"腹部","eq":"自重","tg":"腹肌","sec":"髋屈肌","fx":"平躺，双臂伸向天花板。\n弯曲膝盖，将双腿抬离地面，使臀部和膝盖形成 90 度角。\n接合你的核心和下背部，将你的下背部压入地面。\n慢慢地将右臂和左腿放低至地面，保持它们伸直并悬停在地板上方。\n暂停片刻，然后回到起始位置。\n用左臂和右腿重复该动作。\n继续交替进行所需的重复次数。","tp":"激活放松","risk":false,"img":"img/iny3m5y.webp"},{"id":"9Ap7miY","zh":"下斜卷腹","en":"decline crunch","bp":"腹部","eq":"自重","tg":"腹肌上束","sec":"髋屈肌","fx":"躺在倾斜的长凳上，双脚固定，膝盖弯曲成 90 度角。\n将双手放在脑后或放在胸前。\n收紧腹肌，将上半身抬向膝盖，卷曲躯干。\n在顶部停顿片刻，然后慢慢将上半身放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/9Ap7miY.webp"},{"id": 将双腿抬起到你面前，直到它们与地面平行。\n在顶部暂停片刻，然后慢慢将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/pj0X0tF.webp"},{"id":"Q6bvyen","zh":"悬垂直腿扭转（雨刮器）","en":"hanging straight twisting leg hip raise","bp":"腹部","eq":"自重","tg":"腹斜肌","sec":"髋屈肌","fx":"悬挂在引体向上杆上，双臂完全伸展，双腿伸直。\n启动你的核心并将双腿抬向胸部，保持伸直。\n一旦双腿与地面平行，将臀部向一侧扭转，将双腿移向一侧。\n暂停片刻，然后回到起始位置。\n重复这个动作，但这次将臀部扭向另一侧。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/Q6bvyen.webp"},{"id":"ealLwvX","zh":"高抬腿","en":"high knee against wall","bp":"","eq":"自重","tg":"心肺/有氧","sec":"股四头肌、腘绳肌、臀大肌、小腿腓肠肌","fx":"面向墙壁站立，双脚分开与臀部同宽。\n将双手放在墙上以获得支撑。\n启动你的核心并将右膝抬向胸部，同时将左脚保持在地面上。\n快速换腿，将左膝抬向胸部，然后将右脚放低。\n继续交替双腿进行跑步动作，将膝盖尽可能抬高。\n在整个练习过程中保持快节奏并保持上半身稳定。\n重复所需的持续时间或重复次数。","tp":"多关节动作","risk":false,"img":"img/ealLwvX.webp"},{"id":"196HJGw","zh":"仰卧屈膝提髋‌","en":"hip raise (bent knee)","bp":"腹部","eq":"自重","tg":"腹肌下部","sec":"","fx":"平躺，膝盖弯曲，双脚平放在地上。\n将双手放在身体两侧，掌心朝下。\n收紧核心肌群和臀肌，然后将臀部抬离地面，直到身体从膝盖到肩膀形成一条直线。\n在顶部暂停片刻，然后慢慢将臀部放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/196HJGw.webp"},{"id":"znP9SIh","zh":"仰卧屈腿抱膝触胸","en":"hug keens to chest","bp":"腹部","eq":"自重","tg":"腹肌","sec":"","fx":"首先站立，双脚分开与肩同宽。\n弯曲膝盖并将身体降低至蹲姿。\n当你蹲下时，将膝盖抬向胸部，并用手臂抱住它们。\n保持这个姿势一会儿，然后慢慢回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/znP9SIh.webp"},{"id":"P9ZRyLT","zh":"上斜哑铃飞鸟","en":"hyght dumbbell fly","bp":"胸","eq":"哑铃","tg":"胸肌上束","sec":"三角肌","fx":"平躺在长凳上，双手各握一个哑铃，手掌相对。\n将手臂伸直越过胸部，肘部稍微弯曲。\n保持肘部轻微弯曲，以宽弧线将哑铃向两侧放低，直到感觉到胸部有拉伸感。\n暂停片刻，然后反转动作，将哑铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/P9ZRyLT.webp"},{"id":"zhMwOwE","zh":"山羊挺身‌","en":"hyperextension","bp":"腰部","eq":"自重","tg":"下背部","sec":"臀大肌、腘绳肌","fx":"调整过度伸展凳，使大腿上部放在垫子上并且双脚固定。\n双臂交叉放在胸前或将双手放在脑后。\n将上半身压向地面，同时保持背部挺直。\n在底部停顿片刻，然后抬起上半身，直到与双腿成一直线。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/zhMwOwE.webp"},{"id":"ZgsNQ6d","zh":"毛毛虫爬行","en":"inchworm","bp":"","eq":"自重","tg":"腹肌、肩部，核心","sec":"","fx":"从站立位置开始，双脚分开与臀部同宽。\n腰部向前弯曲，双手放在身前的地面上。\n双手向前移动，直到处于高位平板支撑位置，身体从头到脚成一条直线。\n暂停片刻，然后将双手移回双脚，尽可能保持双腿伸直。\n一旦你的手到达你的脚，站回起始位置。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/ZgsNQ6d.webp"},{"id":"eVxAzgz","zh":"上斜仰卧抬腿进阶","en":"incline leg hip raise (leg straight)","bp":"腹部","eq":"自重","tg":"下腹","sec":"髋屈肌","fx":"躺在倾斜的长凳上，背部平放在长凳上，双腿伸直在身前。\n将双手放在长凳两侧以获得支撑。\n收紧腹肌，将双腿抬离长凳，尽可能抬高双腿，同时保持伸直。\n在顶部暂停片刻，然后慢慢将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/eVxAzgz.webp"},{"id":"B1EVP9F","zh":"上斜俯卧撑","en":"incline push-up","bp":"胸","eq":"自重","tg":"胸肌","sec":"肱三头肌、三角肌","fx":"将双手放在较高的表面上，例如长凳或台阶上，双手之间的距离略宽于肩宽。\n将双腿伸到身后，放在脚掌上，从头到脚跟形成一条直线。\n弯曲肘部，将胸部向升高的表面降低，保持身体呈一条直线。\n在底部暂停片刻，然后伸直手臂将自己推回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/B1EVP9F.webp"},{"id":"GdMa1ET","zh":"上斜肩胛俯卧撑","en":"incline scapula push up","bp":"前锯肌","eq":"自重","tg":"前锯肌","sec":"","fx":"设置一个 45 度角的上斜凳。\n将双手放在长凳上，距离略比肩宽。\n将双脚放在地面上，距离与臀部同宽。\n将胸部向长凳方向降低，保持肘部内收。\n当你降低时，缩回肩胛骨，将肩胛骨挤压在一起。\n推动手掌以伸展手臂并返回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/GdMa1ET.webp"},{"id":"tFGKm99","zh":"股四头肌髋屈肌拉伸中级","en":"intermediate hip flexor and quad stretch","bp":"股四头肌","eq":"自重","tg":"股四头肌","sec":"","fx":"站直，双脚分开与肩同宽。\n抓住一个稳定的物体作为支撑。\n弯曲右膝，将右脚移向臀部，用右手抓住绳子。\n慢慢地将右脚拉向臀部，感受右股四头肌的拉伸。\n保持拉伸 20-30 秒。\n松开拉伸并在左侧重复。","tp":"激活放松","risk":false,"img":"img/tFGKm99.webp"},{"id":"ms7tjSG","zh":"支撑式反向腿弯举","en":"inverse leg curl (bench support)","bp":"腘绳肌","eq":"自重","tg":"腘绳肌","sec":"","fx":"脸朝下躺在长凳上，臀部位于边缘，双腿伸直在身后。\n抓住长凳以获得支撑。\n保持上半身不动，弯曲膝盖并将双腿向臀部弯曲。\n在顶部停顿片刻，然后慢慢将双腿伸展回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ms7tjSG.webp"},{"id":"0rHfvy9","zh":"支撑式反向助力腿弯举","en":"inverse leg curl (on pull-up cable machine)","bp":"腘绳肌","eq":"自重","tg":"腘绳肌","sec":"","fx":"调整缆绳机，使踝带处于最低设置。\n面朝下躺在长凳上，双腿伸展，脚踝带固定在脚上。\n握住长凳的把手以保持稳定。\n弯曲膝盖，将双腿向臀部弯曲，挤压腿筋。\n在动作的最高点暂停片刻，然后慢慢将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/0rHfvy9.webp"},{"id":"VPPtusI","zh":"屈腿倒置划船","en":"inverted row bent knees","bp":"背","eq":"自重","tg":"上背肌群","sec":"肱二头肌","fx":"在腰部高度设置一根横杆，然后躺在其下方。\n正手握住杠铃，握距略宽于肩宽。\n调整身体位置，使脚后跟着地，身体伸直。\n将肩胛骨挤压在一起，将胸部向上拉向杠铃。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/VPPtusI.webp"},{"id":"jdiExfW","zh":"TRX开肘划船","en":"inverted row with straps","bp":"肩","eq":"TRX","tg":"三角肌后束","sec":"肱二头肌","fx":"在胸部高度设置悬挂训练器或带子。\n面向锚点站立，并用正手握住手柄。\n双脚向前走，向后倾斜，直到身体呈一定角度。\n保持身体挺直并启动核心。\n将胸部拉向手柄，将肩胛骨挤压在一起。\n在顶部停顿片刻，然后慢慢降低回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/jdiExfW.webp"},{"id":"mr7pkqP","zh":"开合波比","en":"jack burpee","bp":"","eq":"自重","tg":"心肺/有氧","sec":"股四头肌、腘绳肌、小腿腓肠肌、三角肌、肱三头肌、核心肌群","fx":"从站立位置开始，双脚分开与肩同宽。\n将身体降低至蹲姿，将双手放在身前的地面上。\n双脚向后踢，以俯卧撑姿势落地。\n进行俯卧撑，将胸部降低到地面，然后再向上推。\n双脚向前跳，以蹲姿落地。\n爆发性地跳起，将双臂举过头顶。\n轻轻落地并立即回到蹲姿，开始下一次重复。","tp":"多关节动作","risk":false,"img":"img/mr7pkqP.webp"},{"id":"1g5bPpA","zh":"站姿跳跃开合跳（男）","en":"jack jump (male)","bp":"","eq":"自重","tg":"心肺/有氧","sec":"股四头肌、小腿腓肠肌","fx":"双脚并拢站立，双臂放在身体两侧。\n跳起来，分开双脚，将手臂举过头顶。\n当你落地时，迅速跳回起始位置。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/1g5bPpA.webp"},{"id":"e1e76I2","zh":"跳绳","en":"jump rope","bp":"","eq":"跳绳","tg":"心肺/有氧、臀大肌","sec":"小腿腓肠肌、股四头肌、腘绳肌、臀大肌","fx":"双手握住跳绳的手柄，掌心向内。\n站立，双脚分开与肩同宽，膝盖稍微弯曲。\n将绳子甩过头顶，当绳子靠近你的脚时跳过它。\n轻轻地用脚掌着地，当绳子再次绕回时重复跳跃。\n继续跳跃所需的持续时间或重复次数。","tp":"有氧","risk":false,"img":"img/e1e76I2.webp"},{"id":"LIlE5Tn","zh":"深蹲跳","en":"jump squat","bp":"臀部,股四头肌,小腿三头肌","eq":"自重","tg":"","sec":"","fx":"双脚分开与肩同宽站立。\n弯曲膝盖并将臀部向后推，将身体降低至蹲姿。\n爆发性地跳离地面，伸展臀部、膝盖和脚踝。\n在半空中时，快速将手臂向前伸以保持平衡。\n脚掌轻轻落地，然后立即进入下一个重复动作。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/LIlE5Tn.webp"},{"id":"Kal9cQQ","zh":"进阶壶铃风车","en":"kettlebell advanced windmill","bp":"腰部","eq":"壶铃","tg":"腰腹核心","sec":"腹斜肌、三角肌","fx":"站立，双脚分开比肩宽，脚趾稍微向外。\n右手握住壶铃，手臂伸过头顶，手掌朝前。\n将左脚稍微向右旋转，并将重量转移到左腿上。\n弯曲左膝并铰接在臀部，将躯干向左侧降低。\n保持右臂伸过头顶，眼睛盯着壶铃。\n当你降低躯干时，让右腿伸直，右脚稍微转动。\n降低躯干，直到感觉到左腿筋拉伸并且右臂指向地面。\n暂停片刻，然后启动核心并推动左脚跟返回到起始位置。\n重复所需的重复次数，然后换边。","tp":"训练","risk":false,"img":"img/Kal9cQQ.webp"},{"id":"I4tibZG","zh":"站姿壶铃交替高翻","en":"kettlebell alternating hang clean","bp":"","eq":"壶铃","tg":"前臂、斜方肌、三角肌","sec":"","fx":"双脚分开与肩同宽站立，双手各握一个壶铃，正手握住。\n稍微弯曲膝盖，臀部向前转动，保持背部挺直，挺胸。\n让壶铃悬挂在身体前方，双臂完全伸展。\n以一种流畅的动作，爆发性地伸展臀部，耸肩，并将壶铃拉向肩膀。\n当壶铃到达肩膀高度时，旋转手腕并将壶铃抓住在架子位置，手掌朝内，壶铃放在前臂外侧。\n将壶铃放回起始位置，然后用另一只手臂重复该动作。\n继续交替手臂进行所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/I4tibZG.webp"},{"id":"5KLbZWx","zh":"站姿壶铃交替推举","en":"kettlebell alternating press","bp":"肩","eq":"壶铃","tg":"三角肌","sec":"","fx":"双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高。\n将一只壶铃按过头顶，完全伸展手臂。\n将壶铃降低至肩膀高度。\n用另一只手臂重复上述步骤。\n继续交替手臂进行所需的重复次数。","tp":"训练","risk":false,"img":"img/5KLbZWx.webp"},{"id":"b9kqlBy","zh":"壶铃交替魔鬼划船","en":"kettlebell alternating renegade row","bp":"背","eq":"壶铃","tg":"背阔肌","sec":"","fx":"从高平板支撑位置开始，双手握住壶铃，双脚分开与臀部同宽。\n收紧核心肌群，保持身体从头到脚跟呈一条直线。\n将一个壶铃向上拉向胸部，保持肘部靠近身体。\n将壶铃放回起始位置，然后用另一只手臂重复该动作。\n继续交替手臂进行所需的重复次数。","tp":"训练","risk":false,"img":"img/b9kqlBy.webp"},{"id":"Ca76jUE","zh":"附身壶铃交替划船","en":"kettlebell alternating row","bp":"背","eq":"壶铃","tg":"上背肌群","sec":"肱二头肌","fx":"双脚分开与肩同宽站立，膝盖稍微弯曲，双手各握一个壶铃，手掌朝向身体。\n臀部向前弯曲，保持背部挺直，核心肌群参与。\n将一个壶铃向上拉向胸部，保持肘部靠近身体并将肩胛骨挤压在一起。\n将壶铃放回起始位置，然后用另一只手臂重复该动作。\n继续交替手臂进行所需的重复次数。","tp":"训练","risk":false,"img":"img/Ca76jUE.webp"},{"id":"UM8mgyG","zh":"站姿壶铃单臂阿诺德推举","en":"kettlebell arnold press","bp":"肩","eq":"壶铃","tg":"三角肌","sec":"肱三头肌","fx":"双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高，手掌朝向自己。\n启动你的核心并将壶铃压过头顶，在伸展手臂时旋转手掌以面向前方。\n在动作的最高点暂停，然后慢慢将壶铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/UM8mgyG.webp"},{"id":"kjE55n5","zh":"站姿壶铃侧屈推举","en":"kettlebell bent press","bp":"肩","eq":"壶铃","tg":"三角肌、腹部","sec":"肱三头肌、腹斜肌","fx":"双脚分开与肩同宽站立，右手握住壶铃。\n稍微弯曲膝盖，用右臂将壶铃压过头顶，保持肘部锁定。\n将躯干向左旋转，将重量转移到左脚上。\n弯曲左膝，将躯干压向地面，保持右臂伸过头顶。\n当你下降时，眼睛盯着壶铃，胸部抬起。\n左手接触地面后，将左脚推入并伸直左腿，推动臀部向前。\n当你向前推动臀部时，用你的核心和右臂将壶铃推回到起始位置。\n重复所需的重复次数，然后换边。","tp":"训练","risk":false,"img":"img/kjE55n5.webp"},{"id":"4KJEpzb","zh":"壶铃高翻","en":"kettlebell bottoms up clean from the hang position","bp":"肱二头","eq":"壶铃","tg":"肱二头肌、前臂、三角肌","sec":"前臂、三角肌","fx":"双脚分开与肩同宽站立，一只手握住壶铃，正手握住。\n稍微弯曲膝盖，臀部向前转动，保持背部挺直，挺胸。\n让壶铃垂在双腿之间，手臂完全伸展。\n以一种流畅的动作，爆发性地伸展你的臀部和膝盖，同时将壶铃拉向你的肩膀。\n当壶铃到达肩膀高度时，旋转手腕，使壶铃底部朝上。\n在与肩同高的位置抓住壶铃，肘部弯曲，手掌朝上。\n通过反向运动将壶铃降低回到起始位置。\n重复所需的重复次数，然后换边。","tp":"训练","risk":false,"img":"img/4KJEpzb.webp"}, 背部挺直，双脚平放在地上。\n每只手握住一个壶铃，与肩同高，手掌朝前。\n完全伸展双臂，将壶铃压过头顶。\n在顶部暂停片刻，然后慢慢将壶铃放回肩部水平。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ZEkjZDi.webp"},{"id":"UDm6cGl","zh":"壶铃跷跷板推举","en":"kettlebell seesaw press","bp":"肩","eq":"壶铃","tg":"三角肌前束","sec":"肱三头肌、核心肌群","fx":"双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高。\n将一个壶铃压过头顶，同时将另一个壶铃保持在肩膀高度。\n将按下的壶铃降低至肩膀高度，同时将另一个壶铃压过头顶。\n继续交替按压动作，形成跷跷板状的运动。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/UDm6cGl.webp"},{"id":"8ARQ9Hw","zh":"壶铃相扑高位提拉","en":"kettlebell sumo high pull","bp":"","eq":"壶铃","tg":"臀腿肩","sec":"","fx":"站立，双脚分开比肩宽，脚趾朝外。\n双手握住壶铃放在身体前方，手臂向下伸展。\n弯曲膝盖，降低臀部至下蹲位置，保持背部挺直。\n脚后跟发力，爆发性伸展臀部和膝盖，将壶铃拉向下巴。\n当你向上拉壶铃时，保持肘部高且宽，并将肩胛骨挤压在一起。\n将壶铃放回起始位置，然后重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/8ARQ9Hw.webp"},{"id":"UHJlbu3","zh":"壶铃摇摆","en":"kettlebell swing","bp":"","eq":"壶铃","tg":"臀部、腘绳肌","sec":"核心肌群","fx":"双脚分开与肩同宽站立，脚趾稍微向外。\n双手握住壶铃放在身体前方，双臂伸展。\n稍微弯曲膝盖并铰接臀部，将臀部向后推。\n将壶铃在两腿之间向后摆动，保持手臂伸直并保持背部平坦。\n利用臀部产生的动量，向前推动臀部并将壶铃摆动到肩膀高度。\n让壶铃在双腿之间向下摆动，然后重复该动作达到所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/UHJlbu3.webp"},{"id":"Ha7SZ3y","zh":"壶铃土耳其式起立","en":"kettlebell turkish get up (squat style)","bp":"","eq":"壶铃","tg":"协调/平衡","sec":"","fx":"首先仰卧，双腿伸展，右手握住壶铃，手臂完全伸展到肩膀上方。\n弯曲右膝，将右脚平放在地面上，保持左腿伸展。\n压右脚，将臀部抬离地面，进入桥位。\n将左腿滑到身体下方，弯曲左膝并将左脚平放在地面上。\n将躯干向左旋转，将左手放在地面上以获得支撑。\n压右脚和左手，将躯干抬离地面，形成跪姿。\n从跪姿站起来，保持壶铃伸过头顶。\n反向运动以返回到起始位置。\n从左手的壶铃开始，在另一侧重复练习。","tp":"多关节动作","risk":false,"img":"img/Ha7SZ3y.webp"},{"id":"blBXysN","zh":"壶铃实力推","en":"kettlebell two arm military press","bp":"肩","eq":"壶铃","tg":"三角肌前束","sec":"肱三头肌","fx":"双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高，手掌朝前。\n启动你的核心并将壶铃压过头顶，充分伸展你的手臂。\n在顶部暂停片刻，然后慢慢将壶铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/blBXysN.webp"},{"id":"wf24o8S","zh":"附身壶铃划船","en":"kettlebell two arm row","bp":"背","eq":"壶铃","tg":"上背肌群","sec":"肱二头肌","fx":"双脚分开与肩同宽站立，膝盖稍微弯曲，双手各握一个壶铃，手掌朝向身体。\n臀部向前弯曲，保持背部挺直，核心肌群参与。\n将壶铃拉向胸部，将肩胛骨挤压在一起。\n在顶部暂停片刻，然后慢慢将壶铃放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/wf24o8S.webp"},{"id":"9Tkqa9O","zh":"壶铃风车","en":"kettlebell windmill","bp":"","eq":"壶铃","tg":"腹肌、核心","sec":"腹斜肌、三角肌","fx":"双脚分开与肩同宽站立，右手握住壶铃举过头顶。\n将左脚向外旋转约 45 度，并保持右脚指向前方。\n将你的躯干向左侧弯曲，保持右臂伸过头顶，眼睛盯着壶铃。\n尽可能降低躯干，同时保持右臂伸直，左臂向一侧伸展。\n暂停片刻，然后通过推动右脚并接合斜肌返回到起始位置。\n重复所需的重复次数，然后换边。","tp":"多关节动作","risk":false,"img":"img/9Tkqa9O.webp"},{"id":"UgDm3oy","zh":"跪姿跳深蹲","en":"kneeling jump squat","bp":"臀部,股四头肌","eq":"杠铃","tg":"臀大肌、股四头肌","sec":"","fx":"首先跪在地上，双脚分开与臀部同宽，脚趾向前。\n将杠铃放在上背部，将其放在肩膀上。\n启动你的核心和臀部，然后爆发性地跳到空中，伸展你的臀部和膝盖。\n跳跃时，用脚趾推动并充分伸展脚踝、膝盖和臀部。\n轻轻地回到地面，弯曲膝盖以吸收冲击力。\n立即进入下一个重复，重复跳蹲动作。","tp":"训练","risk":false,"img":"img/UgDm3oy.webp"},{"id":"f38OEuO","zh":"跪姿背部拉伸","en":"kneeling lat stretch","bp":"","eq":"自重","tg":"背阔肌","sec":"三角肌、肱三头肌","fx":"跪在地上，膝盖分开与臀部同宽，脚趾向后。\n将双臂伸过头顶，手指交叉。\n保持背部挺直，慢慢向右侧倾斜，感受左侧背阔肌的拉伸。\n保持伸展动作 20-30 秒，然后回到起始位置。\n在左侧重复该拉伸动作，向左侧倾斜，感受右侧背阔肌的拉伸。\n继续交替进行所需的重复次数。","tp":"激活放松","risk":false,"img":"img/f38OEuO.webp"},{"id":"ZOuKWir","zh":"跪姿俯卧撑","en":"kneeling push-up (male)","bp":"胸","eq":"自重","tg":"胸肌","sec":"肱三头肌","fx":"首先跪在地上，双手与肩同宽，手指指向前方。\n将双腿伸到身后，放在脚掌上，使身体从头到脚跟形成一条直线。\n弯曲肘部，保持核心靠近身体两侧，将身体压向地面。\n继续降低，直到胸部刚好高于地面，然后伸直手臂，将其推回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ZOuKWir.webp"},{"id":"d1GgzTU","zh":"L引体向上","en":"l-pull-up","bp":"背","eq":"自重","tg":"背阔肌","sec":"肱二头肌","fx":"正手握住引体向上杆，握距略宽于肩宽。\n双臂完全伸展，身体伸直。\n收紧背阔肌和二头肌，将身体拉向杠铃杆，保持肘部靠近身体。\n继续拉，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/d1GgzTU.webp"},{"id":"QYysSLV","zh":"地雷杆 180 度转体","en":"landmine 180","bp":"腹部","eq":"杠铃","tg":"腹肌、核心","sec":"腹斜肌","fx":"双脚分开与肩同宽站立，双手握住杠铃于胸前。\n稍微弯曲膝盖并将躯干向右旋转，将杠铃向下朝右臀部摆动。\n当你到达动作的底部时，快速反向运动并向左旋转你的躯干，向上摆动杠铃并穿过你的身体朝向左肩。\n继续这个扭转动作，两侧交替，达到所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/QYysSLV.webp"},{"id":"OyoZ3Pu","zh":"仰卧举腿","en":"leg pull in flat bench","bp":"腹部,股四头肌","eq":"自重","tg":"腹肌下部","sec":"","fx":"坐在平坦的长凳上，双腿在身前伸直。\n将双手放在臀部旁边的长凳上以获得支撑。\n收紧腹肌，将双腿抬离地面，使膝盖靠近胸部。\n在顶部暂停片刻，然后慢慢将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/OyoZ3Pu.webp"},{"id":"sU5BrfP","zh":"仰卧腘绳肌拉伸","en":"leg up hamstring 上，双腿在身前伸展。\n将绳子绕在脚掌上，并用手握住绳子的末端。\n轻轻地将绳子拉向自己，弯曲脚并伸展小腿肌肉。\n保持拉伸 20-30 秒。\n释放绳子上的张力并放松脚。\n在另一条腿上重复该拉伸动作。","tp":"激活放松","risk":false,"img":"img/DEEqoI2.webp"},{"id":"SiWCcTN","zh":"杠铃触地高翻","en":"power clean","bp":"臀部,腘绳肌,股四头肌,小腿三头肌","eq":"杠铃","tg":"协调/爆发力","sec":"","fx":"首先将杠铃放在你面前的地面上，双脚分开与肩同宽。\n弯腰，正手握住杠铃，握距略宽于肩宽。\n将杠铃提离地面时，保持背部挺直，挺胸，伸展臀部和膝盖。\n当杠铃到达大腿中部时，爆发性地将其向上拉，耸肩并将肘部拉高并向两侧拉。\n当杠铃到达最高点时，迅速下降到其下方，旋转肘部，以前蹲姿势将杠铃接在肩膀上。\n握住杠铃站起来，充分伸展臀部和膝盖。\n将杠铃放回起始位置，在整个运动过程中保持对重量的控制。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/SiWCcTN.webp"},{"id":"hCjGsRQ","zh":"平板支撑","en":"power point plank","bp":"腹部","eq":"自重","tg":"腹肌","sec":"","fx":"从高平板支撑位置开始，双手直接放在肩膀下方，身体从头到脚成一条直线。\n启动你的核心并挤压你的臀肌以保持稳定的位置。\n将身体放低到前臂上，一次一只手臂，从头到脚保持一条直线。\n保持这个姿势所需的时间，保持核心肌群和臀肌的参与。\n要返回到起始位置，请推动前臂并将身体抬回到高位平板支撑位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/hCjGsRQ.webp"},{"id":"0V2YQjW","zh":"宽距对握引体向上","en":"pull up (neutral grip)","bp":"背","eq":"自重","tg":"背阔肌","sec":"肱二头肌","fx":"用中立握法（手掌相对）悬挂在引体向上杆上，双臂完全伸展。\n启动你的核心并将肩胛骨挤压在一起。\n弯曲肘部并将肘部向下推向臀部，将身体向上拉向杠铃。\n继续拉，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后有控制地慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/0V2YQjW.webp"},{"id":"UQr48Oi","zh":"健身球收腿","en":"pull-in (on stability ball)","bp":"腹部","eq":"健身球","tg":"腹肌","sec":"髋屈肌","fx":"首先坐在稳定球上，双脚平放在地面上，膝盖弯曲成 90 度角。\n将双手放在稳定球的两侧以获得支撑。\n收紧腹肌，慢慢向前滚动臀部，使膝盖靠近胸部。\n在动作的最高点停顿片刻，然后慢慢将双腿伸展回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/UQr48Oi.webp"},{"id":"lBDjFxJ","zh":"引体向上","en":"pull-up","bp":"背","eq":"自重","tg":"背阔肌中下束","sec":"肱二头肌","fx":"悬挂在引体向上杆上，手掌背向自己，手臂完全伸展。\n启动你的核心并将肩胛骨挤压在一起。\n弯曲肘部并将胸部拉向杠铃杆，将身体向上拉向杠铃杆。\n在动作的最高点暂停，然后慢慢降低身体回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/lBDjFxJ.webp"},{"id":"I4hDWkc","zh":"俯卧撑","en":"push-up","bp":"胸","eq":"自重","tg":"胸大肌","sec":"肱三头肌、三角肌、核心肌群","fx":"从高位平板支撑开始，双手分开略宽于肩宽，双脚并拢。\n弯曲肘部，调动核心力量，将身体压向地面，保持身体呈一条直线。\n当你的胸部刚好高于地面时，暂停片刻，然后伸直手臂，将自己推回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/I4hDWkc.webp"},{"id":"2kr2lWy","zh":"boso球俯卧撑","en":"push-up (bosu ball)","bp":"胸","eq":"自重","tg":"胸大肌","sec":"肱三头肌、三角肌、核心肌群","fx":"将博苏球平放在地上，平面朝上。\n将自己置于俯卧撑位置，双手放在博苏球的外边缘。\n弯曲肘部，调动核心力量，将身体向博苏球方向降低。\n伸展双臂，将自己推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/2kr2lWy.webp"},{"id":"tgryw5Y","zh":"健身球俯卧撑","en":"push-up (on stability ball)","bp":"胸","eq":"健身球","tg":"胸大肌","sec":"肱三头肌、三角肌、核心肌群","fx":"将稳定球放在地上，面朝下，双手放在球上，与肩同宽。\n将双腿伸直在身后，用脚趾保持平衡。\n弯曲肘部，调动核心力量，将胸部向球方向降低，保持身体呈一条直线。\n在底部暂停片刻，然后伸直手臂将自己推回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/tgryw5Y.webp"},{"id":"W8KAlkI","zh":"药球俯卧撑","en":"push-up medicine ball","bp":"胸","eq":"自重","tg":"胸大肌","sec":"肱三头肌、三角肌、核心肌群","fx":"从高平板支撑位置开始，双手放在健身球上，距离与肩同宽。\n弯曲肘部，保持背部挺直，调动核心力量，将身体降低至地面。\n推动手掌以伸展手臂并返回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/W8KAlkI.webp"},{"id":"4Jt8QsQ","zh":"钻石俯卧撑","en":"push-up on lower arms","bp":"肱三头","eq":"自重","tg":"肱三头肌","sec":"胸肌","fx":"从平板支撑位置开始，前臂放在地面上，肘部位于肩膀正下方。\n调动你的核心力量，让你的身体从头到脚保持在一条直线上。\n弯曲肘部，使胸部靠近地面，使胸部靠近地面。\n在底部暂停片刻，然后将自己推回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/4Jt8QsQ.webp"},{"id":"mweqJin","zh":"站姿快速踏步","en":"quick feet v. 2","bp":"","eq":"自重","tg":"","sec":"","fx":"双脚分开与肩同宽站立，双臂放在身体两侧。\n首先快速上下移动双脚，就像原地跑步一样。\n保持动作快速而轻盈，重点放在脚掌上。\n继续所需的持续时间或重复次数。","tp":"多关节动作","risk":false,"img":"img/mweqJin.webp"},{"id":"xifhB5W","zh":"后三角肌拉伸","en":"rear deltoid stretch","bp":"肩","eq":"自重","tg":"三角肌后束","sec":"菱形肌","fx":"站直，双脚分开与肩同宽。\n将右臂伸过胸部，将左手放在右肘上。\n轻轻地将右臂拉向左肩，感受右肩的拉伸。\n保持拉伸 15-30 秒，然后放松。\n在另一侧重复。","tp":"激活放松","risk":false,"img":"img/xifhB5W.webp"},{"id":"CbFSYC1","zh":"颈后引体向上","en":"rear pull-up","bp":"背","eq":"自重","tg":"背阔肌","sec":"肱二头肌","fx":"正手握住引体向上杆，握距略宽于肩宽。\n悬挂在杠上，双臂完全伸展，身体伸直。\n收紧背部肌肉，将身体拉向杠铃杆，保持肘部靠近身体。\n继续拉，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/CbFSYC1.webp"},{"id":"Pjbc0Kt","zh":"跪姿弹力带臀桥","en":"resistance band hip thrusts on knees (female)","bp":"臀部","eq":"弹力带","tg":"臀大肌","sec":"腘绳肌、股四头肌","fx":"首先跪在地上，膝盖分开与臀部同宽，双脚弯曲。\n将阻力带缠绕在大腿上，就在膝盖上方。\n将双手放在臀部或向前伸展以保持平衡。\n调动你的臀肌和核心肌肉。\n当你将膝盖抬离地面时，向前推动臀部并挤压臀部，伸展臀部直到大腿与地面平行。\n保持该姿势片刻，然后慢慢将膝盖放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/Pjbc0Kt.webp"},{"id":"0xDpB4L","zh":"坐姿弹力弹髋外展","en":"resistance band seated hip abduction","bp":"大腿外展肌","eq":"弹力带","tg":"大腿外展肌、臀大肌","sec":"","fx":"坐在椅子或长凳上，背部挺直，双脚平放在地面上。\n将阻力带缠绕在大腿上，就在膝盖上方。\n将双手放在椅子或长凳的两侧以获得支撑。\n启动外展肌（大腿外侧肌肉），并克服弹力带的阻力，慢慢将膝盖分开。\n动作结束时暂停片刻，然后慢慢将膝盖放回一起。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/0xDpB4L.webp"},{"id":"S93zLTG","zh":"坐姿弹力弹肩推举","en":"resistance band seated shoulder press","bp":"肩","eq":"弹力带","tg":"三角肌","sec":"肱三头肌","fx":"坐在椅子或长凳上，背部挺直，双脚平放在地面上。\n双手握住阻力带，手掌朝前，将其拉至肩部水平。\n将弹力带压过头顶，充分伸展双臂。\n在顶部停顿片刻，然后慢慢将弹力带降低至肩部水平。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/S93zLTG.webp"},{"id":"nCU1Ekp","zh":"反向卷腹","en":"reverse crunch","bp":"腹部","eq":"自重","tg":"腹肌下部","sec":"","fx":"平躺，双臂沿着身体两侧伸展。\n弯曲膝盖，将脚抬离地面，使大腿垂直于地板。\n收缩腹肌，将臀部卷离地板，使膝盖靠近胸部。\n在顶部暂停片刻，然后慢慢将臀部放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/nCU1Ekp.webp"},{"id":"ecpY0rH","zh":"器械反握高位下拉","en":"reverse grip machine lat pulldown","bp":"背","eq":"分动（挂片）","tg":"背阔肌","sec":"肱二头肌","fx":"调整座椅高度，将自己放在机器上，膝盖位于垫子下方，双脚平放在地面上。\n反手握住手柄，握距略宽于肩宽。\n坐直，挺胸，肩膀向后，保持下背部轻微的拱形。\n将手柄向下拉向胸部，将肩胛骨挤压在一起。\n在动作底部暂停片刻，然后慢慢松开手柄回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ecpY0rH.webp"},{"id":"YAk5dIw","zh":"反握引体向上","en":"reverse grip pull-up","bp":"背","eq":"自重","tg":"背阔肌中下部","sec":"肱二头肌","fx":"双手分开与肩同宽，反握抓住引体向上杆。\n悬挂在杠上，双臂完全伸展，身体伸直。\n调动背部肌肉，将身体拉向杠铃杆，以胸部为主导。\n继续拉，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/YAk5dIw.webp"},{"id":"OrETs32","zh":"平板凳摆腿","en":"reverse hyper on flat bench","bp":"臀部","eq":"自重","tg":"臀大肌","sec":"腘绳肌、下背肌群","fx":"脸朝下躺在平坦的长凳上，臀部位于边缘，双腿悬在长凳上。\n抓住长凳以保持稳定。\n保持双腿伸直，尽可能将它们抬向天花板。\n在动作的最高点挤压臀部。\n慢慢地将双腿放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/OrETs32.webp"},{"id":"ezTvXcr","zh":"x悬垂吊环臂屈伸","en":"ring dips","bp":"胸","eq":"自重","tg":"胸大肌","sec":"三角肌","fx":"首先，将手臂完全伸展，身体伸直，挂在吊环上。\n弯曲肘部，降低身体，直到肩膀低于肘部。\n伸直手臂，将自己推回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/ezTvX 个重复动作。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/6FMU51h.webp"},{"id":"YtgD7Xq","zh":"窄握引体向","en":"shoulder grip pull-up","bp":"背","eq":"自重","tg":"背阔肌中下部","sec":"肱二头肌","fx":"握距与肩同宽，抓住引体向上杆，手掌背向自己。\n双臂完全伸展，自由悬挂。\n启动背部肌肉，将身体向上拉向杠铃，直到下巴位于杠铃上方。\n在顶部停顿片刻，然后慢慢将身体放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/YtgD7Xq.webp"},{"id":"yRpV5TC","zh":"支撑交替摸肩","en":"shoulder tap","bp":"","eq":"自重","tg":"腹肌","sec":"","fx":"从高平板支撑位置开始，双手直接放在肩膀下方，身体呈一条直线。\n启动你的核心并将右手抬离地面，伸手拍打你的左肩。\n将右手放回地面，然后用左手轻拍右肩，重复此操作。\n继续交替轻拍肩膀，同时保持臀部和躯干稳定。\n重复所需的重复次数。","tp":"多关节动作","risk":false,"img":"img/yRpV5TC.webp"},{"id":"qEse6fe","zh":"俯卧撑交替摸肩","en":"shoulder tap push-up","bp":"胸","eq":"自重","tg":"胸大肌","sec":"肱三头肌、核心肌群","fx":"从高位平板支撑开始，双手分开略宽于肩宽，身体从头到脚跟呈一条直线。\n弯曲肘部，使肘部靠近身体两侧，将身体降低到地面。\n当你向后推时，将右手抬离地面并轻拍左肩。\n将右手放回地面并重复俯卧撑，这次抬起左手并拍打右肩。\n每次重复俯卧撑时，继续交替拍肩。\n在整个练习过程中保持核心稳定并避免臀部过度旋转。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/qEse6fe.webp"},{"id":"WL4EmxJ","zh":"侧桥髋外展","en":"side bridge hip abduction","bp":"臀部","eq":"自重","tg":"臀中肌","sec":"臀大肌","fx":"侧躺，双腿伸展并叠放在一起。\n用前臂支撑自己，将肘部保持在肩膀正下方。\n启动你的核心并将臀部抬离地面，从头到脚形成一条直线。\n在保持核心肌群参与的同时，尽可能高地抬起上面的那条腿，但不要旋转臀部。\n在顶部停顿片刻，然后将腿放下。\n重复所需的重复次数，然后换边。","tp":"训练","risk":false,"img":"img/WL4EmxJ.webp"},{"id":"RKjH6Lt","zh":"侧桥","en":"side bridge v. 2","bp":"腰部","eq":"自重","tg":"侧腰","sec":"腹斜肌","fx":"侧躺，双腿伸展并叠放在一起。\n将前臂放在肩膀正下方的地面上，肘部弯曲成 90 度角。\n启动你的核心并将臀部抬离地面，从头到脚形成一条直线。\n保持此位置所需的时间。\n将臀部放低至起始位置。\n在另一侧重复。","tp":"训练","risk":false,"img":"img/RKjH6Lt.webp"},{"id":"7WaDzyL","zh":"侧卧单腿髋外展","en":"side hip abduction","bp":"大腿外展肌","eq":"自重","tg":"大腿外展肌","sec":"臀大肌","fx":"双脚分开与肩同宽站立，双手放在臀部。\n将重心转移到一条腿上，并将另一条腿向一侧抬起，保持伸直。\n在顶部暂停片刻，然后慢慢将腿放回起始位置。\n在另一侧重复。\n继续交替进行所需的重复次数。","tp":"训练","risk":false,"img":"img/7WaDzyL.webp"},{"id":"c8f5cSY","zh":"侧卧髋内收","en":"side lying hip adduction (male)","bp":"内收肌","eq":"自重","tg":"大腿内收肌","sec":"","fx":"侧躺，双腿伸直并叠放在一起。\n将下臂放在头下方以获得支撑。\n启动内收肌并尽可能高地抬起上面的腿，但不要旋转臀部或向后倾斜。\n在顶部暂停片刻，然后慢慢将腿放回起始位置。\n重复所需的重复次数，然后换边。","tp":"训练","risk":false,"img":"img/c8f5cS d 45 degrees one leg press","bp":"臀部,股四头肌","eq":"分动（挂片）","tg":"臀大肌、股四头肌","sec":"","fx":"将雪橇机调整至 45 度角。\n坐在雪橇机上，背部靠在垫子上，双脚放在踏板上。\n将一只脚放在踏板上并伸展腿，将雪橇推离您。\n慢慢弯曲膝盖，将雪橇放回起始位置。\n换另一条腿重复上述步骤。\n继续交替双腿达到所需的重复次数。","tp":"训练","risk":false,"img":"img/WWD6FzI.webp"},{"id":"qCNVnaU","zh":"45 度倒蹬机提踵","en":"sled 45в° calf press","bp":"小腿三头肌","eq":"分动（挂片）","tg":"小腿三头肌","sec":"","fx":"将雪橇机调整至 45 度角。\n将脚放在雪橇平台上，脚趾朝前。\n伸展脚踝和小腿，将雪橇平台推离您。\n在顶部暂停片刻，然后慢慢将雪橇平台放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/qCNVnaU.webp"},{"id":"tj41Nu6","zh":"45°宽距倒蹬","en":"sled 45в° leg wide press","bp":"臀部,股四头肌","eq":"分动（挂片）","tg":"臀大肌、股四头肌","sec":"比目鱼肌","fx":"将雪橇机调整至 45 度角。\n坐在雪橇机上，背部靠在垫子上，双脚放在脚踏平台上。\n双脚分开的距离比肩宽。\n推动脚部平台以伸展双腿并伸直膝盖。\n动作结束时暂停片刻，然后慢慢弯曲膝盖回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/tj41Nu6.webp"},{"id":"gf3ZjB9","zh":"窄距哈克深蹲","en":"sled closer hack squat","bp":"臀部,股四头肌","eq":"分动（挂片）","tg":"臀大肌、股四头肌","sec":"","fx":"将雪橇机调整到舒适的重量，并将背部靠在垫子上。\n将双脚分开与肩同宽放在平台上，脚趾稍微向外。\n握住机器两侧的手柄以保持稳定性。\n弯曲膝盖和臀部，调动核心力量，慢慢降低身体，保持背部挺直。\n继续降低，直到大腿与地面平行或略低于地面。\n在底部停顿片刻，然后用脚跟推动双腿并返回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/gf3ZjB9.webp"},{"id":"XDOiFns","zh":"哈克提踵","en":"sled forward angled calf raise","bp":"小腿三头肌","eq":"分动（挂片）","tg":"小腿三头肌","sec":"","fx":"将雪橇机调整到舒适的重量，然后将自己放在机器上，脚趾放在平台上，脚后跟悬空。\n将手放在机器的手柄或侧面上以获得支撑。\n收紧小腿，慢慢地尽可能高地抬起脚后跟，克服雪橇的阻力。\n在动作的最高点暂停片刻，然后慢慢降低脚跟回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/XDOiFns.webp"},{"id":"Qa55kX1","zh":"中距哈克深蹲","en":"sled hack squat","bp":"臀部,股四头肌","eq":"分动（挂片）","tg":"臀大肌、股四头肌","sec":"","fx":"将雪橇机调整到适合您身高的舒适位置。\n双脚与肩同宽站立在平台上，脚趾稍微向外。\n握住手柄或杆以保持稳定性。\n弯曲膝盖和臀部，降低身体，保持背部挺直，挺胸。\n继续降低，直到大腿与地面平行或略低于地面。\n暂停片刻，然后用脚后跟将身体抬回到起始位置。\n重复所需的重复次数。","tp":"训练","risk":false,"img":"img/Qa55kX1.webp"},{"id":"g376LuL","zh":"俯卧器械提踵","en":"sled lying calf press","bp":"小腿三头肌","eq":"器械（钢线）","tg":"小腿三头肌","sec":"","fx":"将雪橇机调整至舒适的重量。\n坐在雪橇机上，背部靠在垫子上，双脚放在平台上。\n将脚趾和脚掌放在平台边缘，脚跟悬空。\n伸展脚踝，将平台推离您，保持膝盖稍微弯曲。\n继续用力，直到小腿完全收缩。\n保持收缩一会儿，然后慢慢将平台放回起始位置。\n重复所需的重复次数。","tp":"训练","risk":fal
