<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYRWELL Coach · 教练工作台 原型V2</title>
<style>
:root{
  --navy:#0D294D; --navy2:#08192e; --blue:#188DAD; --teal:#26B0A8;
  --bg:#F2F4F7; --card:#FFFFFF; --line:#E4E8EE;
  --txt:#12253F; --dim:#7A8797; --warn:#D9534F; --ok:#2F9E6E;
  --sel:#EAF4F9;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#dfe4ea;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;min-height:100vh}
.phone{width:390px;height:844px;background:var(--bg);border-radius:38px;box-shadow:0 24px 60px rgba(13,41,77,.28);overflow:hidden;display:flex;flex-direction:column;position:relative;border:8px solid #0b1a2e}
.statusbar{height:34px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;flex-shrink:0}
.appbar{background:var(--navy);color:#fff;padding:10px 18px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.appbar .brand{display:flex;align-items:center;gap:9px}
.appbar .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.appbar .ttl{font-size:15px;font-weight:700;letter-spacing:.5px}
.appbar .role{font-size:10px;color:#9fc4d8;letter-spacing:1.5px;margin-top:1px}
.appbar .ava{width:30px;height:30px;border-radius:50%;background:#1b3c66;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8fd8d3;border:1px solid #2c5480}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;padding:14px}
.scroll::-webkit-scrollbar{width:0}
.tabbar{height:62px;background:#fff;border-top:1px solid var(--line);display:flex;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--dim);cursor:pointer;transition:.15s}
.tab.on{color:var(--navy);font-weight:700}
.tab .ic{font-size:19px;line-height:1}

/* ===== 动作库：左竖栏 + 右内容 ===== */
.lib{flex:1;display:flex;min-height:0}
.lib-side{width:88px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0}
.lib-side::-webkit-scrollbar{width:0}
.side-item{padding:13px 8px;font-size:12.5px;color:var(--dim);text-align:center;cursor:pointer;border-left:3px solid transparent;transition:.15s;line-height:1.3}
.side-item.on{color:var(--navy);font-weight:700;background:var(--sel);border-left-color:var(--navy)}
.side-item .n{font-size:9.5px;color:#b3bcc8;display:block;margin-top:2px}
.lib-main{flex:1;display:flex;flex-direction:column;min-width:0}
.lib-top{padding:10px 12px 8px;background:var(--bg)}
.search{display:flex;gap:7px;margin-bottom:9px}
.search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;outline:none;background:#fff}
.search input:focus{border-color:var(--teal)}
.eqchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.eqchips::-webkit-scrollbar{display:none}
.eqchip{font-size:11.5px;padding:5px 11px;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--dim);white-space:nowrap;cursor:pointer;transition:.15s}
.eqchip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.lib-body{flex:1;overflow-y:auto;padding:0 12px 16px}
.lib-body::-webkit-scrollbar{width:0}
.cnt{font-size:11px;color:var(--dim);margin:2px 0 9px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ex{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(13,41,77,.06);transition:.15s;position:relative}
.ex:active{transform:scale(.97)}
.ex .thumb{width:100%;aspect-ratio:1/1;background:#f7f9fb;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ex .thumb img{width:100%;height:100%;object-fit:contain}
.ex .lb{position:absolute;top:6px;left:6px;font-size:9px;background:rgba(24,141,173,.9);color:#fff;padding:1.5px 6px;border-radius:5px;font-weight:600}
.ex .body{padding:7px 8px 9px}
.ex .nm{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:31px}
.ex .meta{font-size:9.5px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riskdot{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:#FDECEC;color:var(--warn);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 4px;font-size:12px;color:var(--dim)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 13px;font-size:12px;color:var(--navy);cursor:pointer}
.pager button:disabled{opacity:.4}

/* 详情弹层 */
.sheet{position:absolute;inset:0;background:rgba(10,22,40,.5);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheet-in{background:#fff;width:100%;max-height:86%;border-radius:20px 20px 0 0;overflow-y:auto;padding:18px 18px 26px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.sheet-h .t{font-size:17px;font-weight:800;line-height:1.35}
.sheet-h .e{font-size:11.5px;color:var(--dim);margin-top:3px}
.close{border:none;background:#F0F3F7;width:28px;height:28px;border-radius:50%;font-size:15px;color:#5c6b7f;cursor:pointer;flex-shrink:0}
.demo{width:100%;height:210px;background:#f7f9fb;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.demo img{max-width:100%;max-height:100%;object-fit:contain}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.tg{font-size:10px;padding:2.5px 8px;border-radius:6px;background:#EEF2F7;color:#5c6b7f}
.tg.bp{background:#E7F3F1;color:var(--teal);font-weight:600}
.tg.rk{background:#FDECEC;color:var(--warn);font-weight:600}
h4{font-size:13px;color:var(--navy);margin:14px 0 7px;display:flex;align-items:center;gap:6px}
h4::before{content:'';width:3px;height:13px;background:var(--teal);border-radius:2px}
.steps{counter-reset:s}
.step{display:flex;gap:9px;font-size:12.5px;line-height:1.6;padding:6px 0;color:#33465c}
.step .no{width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-weight:700}
.note{background:#FFF8E8;border:1px solid #F2DFB0;border-radius:11px;padding:10px 12px;font-size:12px;color:#8a6a1f;line-height:1.6;margin-top:12px}
.note.red{background:#FDECEC;border-color:#F3C9C7;color:#a13b38}
.btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn.primary{background:var(--navy);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btnrow{display:flex;gap:9px;margin-top:14px}
.btnrow .btn{flex:1}

/* 通用卡片/页 */
h3.sec{font-size:13px;color:var(--dim);margin:16px 0 9px;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
h3.sec:first-child{margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(13,41,77,.06)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:4px}
.stat{background:#fff;border-radius:13px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(13,41,77,.06)}
.stat .n{font-size:21px;font-weight:800;color:var(--navy);line-height:1.2}
.stat .n small{font-size:11px;font-weight:600}
.stat .l{font-size:10.5px;color:var(--dim);margin-top:3px}
.slot{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.slot:last-child{border-bottom:none;padding-bottom:0}
.slot .time{font-size:12px;font-weight:700;color:var(--navy);width:44px;flex-shrink:0}
.slot .nm{font-size:13.5px;font-weight:600}
.slot .sub{font-size:11px;color:var(--dim);margin-top:2px}
.pill{font-size:10px;padding:2px 8px;border-radius:20px;flex-shrink:0;font-weight:600}
.pill.wait{background:#EAF4F9;color:var(--blue)}
.pill.risk{background:#FDECEC;color:var(--warn)}
.mcard{display:flex;gap:12px;align-items:center;cursor:pointer}
.mava{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.mname{font-size:14.5px;font-weight:700}
.mmeta{font-size:11.5px;color:var(--dim);margin-top:3px}
.arrow{color:#c3cbd6;font-size:16px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pitem:last-child{border-bottom:none}
.pitem .idx{width:22px;height:22px;border-radius:7px;background:#EEF2F7;color:var(--navy);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pitem .info{flex:1;min-width:0}
.pitem .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .cfg{font-size:11px;color:var(--dim);margin-top:2px}
.del{border:none;background:none;color:#c3cbd6;font-size:16px;cursor:pointer;padding:4px}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:34px 0}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(13,41,77,.93);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:80%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>TYRWELL Coach · V2</span><span>􀛨 􀙇 􀛪</span></div>
  <div class="appbar">
    <div class="brand"><div class="mark">T</div>
      <div><div class="ttl" id="appttl">今日工作台</div><div class="role" id="approle">TYRWELL · 体尔健康</div></div>
    </div>
    <div class="ava" id="ava">于</div>
  </div>
  <div class="content" id="content"></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script src="_v2_data.js"></script>
<script>
/* ================= 状态 ================= */
const S = JSON.parse(localStorage.getItem('tyrwell_coach_v2') || 'null') || {
  page:'today',
  members:[
    {id:'m1',name:'陈慧敏',sex:'女',age:52,goal:'减脂 + 膝关节康复',color:'#26B0A8',
     health:{conditions:'右膝单髁置换术后3个月',injuries:'右膝：避免深蹲、跳跃、跑',surgery:'2026-06 右膝单髁置换',bp:'128/82',med:'无'},
     body:{height:162,weight:68.5,bf:31.2},last:'09-13',
     history:[{d:'09-13',t:'下肢康复 · 器械为主',n:'完成4组坐姿腿屈伸'}]},
    {id:'m2',name:'张伟',sex:'男',age:38,goal:'增肌（胸背腿）',color:'#188DAD',
     health:{conditions:'无慢性病史',injuries:'无',surgery:'无',bp:'118/76',med:'无'},
     body:{height:178,weight:76.2,bf:18.4},last:'09-14',history:[{d:'09-14',t:'胸 + 三头',n:'卧推60kg×8×4'}]},
    {id:'m3',name:'李晓雨',sex:'女',age:29,goal:'体态塑形（臀腿优先）',color:'#7B68B5',
     health:{conditions:'腰椎间盘突出史（已稳定）',injuries:'腰：避免负重前屈、大重量硬拉',surgery:'无',bp:'110/70',med:'无'},
     body:{height:166,weight:54.8,bf:23.6},last:'09-12',history:[{d:'09-12',t:'臀腿 + 核心',n:'臀推40kg×12×4'}]},
    {id:'m4',name:'王强',sex:'男',age:45,goal:'减脂 + 血压管理',color:'#D98A4F',
     health:{conditions:'高血压（服药控制中）',injuries:'无',surgery:'无',bp:'142/90',med:'氨氯地平5mg'},
     body:{height:175,weight:88.5,bf:27.8},last:'09-11',history:[{d:'09-11',t:'有氧 + 全身循环',n:'中等强度35分钟'}]}
  ],
  plans:{}, records:{},
  lib:{bp:'全部', eq:'全部', kw:'', page:1}
};
const save=()=>localStorage.setItem('tyrwell_coach_v2',JSON.stringify(S));
const M=id=>S.members.find(m=>m.id===id);
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)};

/* ================= 部位/器械枚举 ================= */
const BPS=['全部','胸','背','肩','肱二头','肱三头','小臂','腹部','腰部','臀部','股四头肌','腘绳肌','小腿三头肌','斜方肌','前锯肌','内收肌','大腿外展肌','胫骨前肌'];
const EQS=['全部','自重','哑铃','杠铃','器械（钢线）','史密斯','弹力带','分动（挂片）','壶铃','杠铃片','健身球','泡沫球','TRX','药球','战绳','跳绳','单车','跑步机','椭圆机','滑雪机','登山机','大锤','轮胎','腕卷器'];
const PER=24;

/* 部位匹配：支持多标签 */
const bpMatch=(item,sel)=> sel==='全部' ? true : (item.bp||'').split(/[,，、;；]/).map(s=>s.trim()).includes(sel);

function libList(){
  const f=S.lib;
  return EXERCISES.filter(e=>
    bpMatch(e,f.bp) &&
    (f.eq==='全部'||e.eq===f.eq) &&
    (!f.kw || (e.zh||'').includes(f.kw) || (e.en||'').toLowerCase().includes(f.kw.toLowerCase()))
  );
}
function bpCount(name){
  if(name==='全部') return EXERCISES.length;
  return EXERCISES.filter(e=>bpMatch(e,name)).length;
}

/* ================= 路由 ================= */
const TABS=[{k:'today',ic:'🏠',l:'今日'},{k:'members',ic:'👥',l:'会员'},{k:'library',ic:'📚',l:'动作库'},{k:'plan',ic:'📋',l:'计划'}];
function renderTabs(){document.getElementById('tabbar').innerHTML=TABS.map(t=>`<div class="tab ${S.page===t.k?'on':''}" onclick="go('${t.k}')"><div class="ic">${t.ic}</div>${t.l}</div>`).join('');}
function go(p,extra){S.page=p; if(extra)Object.assign(S,extra); save(); render();}

function render(){
  renderTabs();
  const c=document.getElementById('content'),T=document.getElementById('appttl'),R=document.getElementById('approle');
  if(S.page==='today'){T.textContent='今日工作台';R.textContent='TYRWELL · 体尔健康';c.innerHTML=viewToday();}
  else if(S.page==='members'){T.textContent='我的会员';R.textContent=S.members.length+' 位在管';c.innerHTML=viewMembers();}
  else if(S.page==='member'){const m=M(S.cur);T.textContent=m.name;R.textContent='身体档案';c.innerHTML=viewMember(m);}
  else if(S.page==='library'){T.textContent='动作库';R.textContent=EXERCISES.length+' 个标准动作';c.innerHTML=viewLibrary();}
  else if(S.page==='plan'){T.textContent='训练计划';R.textContent='排课 · 执行 · 记录';c.innerHTML=viewPlan();}
}
function scrollTop(){const e=document.querySelector('.scroll,.lib-body');if(e)e.scrollTop=0;}

/* ================= 今日 ================= */
function viewToday(){
  return `<div class="scroll">
  <div class="stats">
    <div class="stat"><div class="n">3</div><div class="l">今日课次</div></div>
    <div class="stat"><div class="n">${S.members.length}</div><div class="l">在管会员</div></div>
    <div class="stat"><div class="n">${EXERCISES.length}</div><div class="l">动作库</div></div>
  </div>
  <h3 class="sec">今日课表 <span style="font-size:11px">9月19日</span></h3>
  <div class="card">
    <div class="slot"><div class="time">10:00</div><div class="grow"><div class="nm">陈慧敏</div><div class="sub">下肢康复 · 器械为主 · 45min</div></div><span class="pill risk">⚠ 右膝术后</span></div>
    <div class="slot"><div class="time">15:30</div><div class="grow"><div class="nm">张伟</div><div class="sub">胸 + 三头 · 力量 · 60min</div></div><span class="pill wait">待排计划</span></div>
    <div class="slot"><div class="time">19:00</div><div class="grow"><div class="nm">李晓雨</div><div class="sub">臀腿 + 核心 · 50min</div></div><span class="pill wait">待排计划</span></div>
  </div>
  <h3 class="sec">需要处理</h3>
  <div class="card">
    <div class="slot"><div class="time" style="color:var(--warn)">⚠</div><div class="grow"><div class="nm">陈慧敏 · 右膝术后禁忌</div><div class="sub">排计划自动校验：深蹲/跳跃/跑</div></div></div>
    <div class="slot"><div class="time" style="color:var(--warn)">⚠</div><div class="grow"><div class="nm">王强 · 高血压</div><div class="sub">控制强度，避免憋气大重量</div></div></div>
  </div>
  <div style="text-align:center;font-size:10.5px;color:#8fa3bb;letter-spacing:1px;margin-top:16px">TYRWELL · GUARD YOUR HEALTH. LIVE YOUR LIFE.</div>
  </div>`;
}

/* ================= 会员 ================= */
function viewMembers(){
  return `<div class="scroll">${S.members.map(m=>`
  <div class="card mcard" onclick="go('member',{cur:'${m.id}'})">
    <div class="mava" style="background:${m.color}">${m.name[0]}</div>
    <div class="grow"><div class="mname">${m.name} <span style="font-size:11px;color:var(--dim);font-weight:400">${m.sex} · ${m.age}岁</span></div>
      <div class="mmeta">${m.goal}</div><div class="mmeta" style="margin-top:4px">最近训练 ${m.last}</div></div>
    <span class="arrow">›</span>
  </div>`).join('')}</div>`;
}
function viewMember(m){
  const pl=S.plans[m.id]||[];
  return `<div class="scroll">
  <div class="card"><div class="row">
    <div class="mava" style="background:${m.color};width:52px;height:52px;font-size:18px">${m.name[0]}</div>
    <div class="grow"><div class="mname" style="font-size:16px">${m.name}</div><div class="mmeta">${m.sex} · ${m.age}岁 · ${m.goal}</div></div>
  </div></div>
  <h3 class="sec">身体数据</h3>
  <div class="stats">
    <div class="stat"><div class="n">${m.body.height}<small>cm</small></div><div class="l">身高</div></div>
    <div class="stat"><div class="n">${m.body.weight}<small>kg</small></div><div class="l">体重</div></div>
    <div class="stat"><div class="n">${m.body.bf}<small>%</small></div><div class="l">体脂率</div></div>
  </div>
  <h3 class="sec">健康与限制 <span style="font-size:10px;color:var(--teal)">安全字段</span></h3>
  <div class="card">
    <div class="slot"><div class="time" style="width:56px;color:var(--dim);font-weight:400;font-size:11.5px">健康状况</div><div class="grow"><div class="nm" style="font-size:13px">${m.health.conditions}</div></div></div>
    <div class="slot"><div class="time" style="width:56px;color:var(--dim);font-weight:400;font-size:11.5px">手术史</div><div class="grow"><div class="nm" style="font-size:13px">${m.health.surgery}</div></div></div>
    <div class="slot"><div class="time" style="width:56px;color:var(--warn);font-weight:400;font-size:11.5px">禁忌</div><div class="grow"><div class="nm" style="font-size:13px;color:#a13b38">${m.health.injuries}</div></div></div>
    <div class="slot"><div class="time" style="width:56px;color:var(--dim);font-weight:400;font-size:11.5px">血压</div><div class="grow"><div class="nm" style="font-size:13px">${m.health.bp} · 用药：${m.health.med}</div></div></div>
  </div>
  <h3 class="sec">训练历史</h3>
  <div class="card">${m.history.map(h=>`<div class="slot"><div class="time" style="width:44px">${h.d}</div><div class="grow"><div class="nm" style="font-size:13px">${h.t}</div><div class="sub">${h.n}</div></div></div>`).join('')}</div>
  <h3 class="sec">当前计划 ${pl.length?'· '+pl.length+' 个动作':''}</h3>
  <div class="card">${pl.length?pl.map((p,i)=>`<div class="pitem"><div class="idx">${i+1}</div><div class="info"><div class="nm">${p.zh}</div><div class="cfg">${p.sets} 组 × ${p.reps} 次</div></div></div>`).join(''):'<div class="empty">还没排计划</div>'}</div>
  <div class="btnrow"><button class="btn ghost" onclick="go('members')">返回</button><button class="btn primary" onclick="go('library',{forMember:'${m.id}'})">排训练计划</button></div>
  </div>`;
}

/* ================= 动作库（参考图布局） ================= */
function viewLibrary(){
  const f=S.lib, all=libList();
  const pages=Math.max(1,Math.ceil(all.length/PER)), pg=Math.min(f.page,pages);
  const slice=all.slice((pg-1)*PER,pg*PER);
  const m=S.forMember?M(S.forMember):null;
  return `<div class="lib">
    <div class="lib-side">${BPS.map(b=>`<div class="side-item ${f.bp===b?'on':''}" onclick="setBP('${b}')">${b}<span class="n">${bpCount(b)}</span></div>`).join('')}</div>
    <div class="lib-main">
      <div class="lib-top">
        ${m?`<div style="background:#E7F3F1;border-radius:10px;padding:8px 10px;margin-bottom:9px;font-size:11.5px;color:#12615c"><b>正在为 ${m.name} 排计划</b> · ${m.health.injuries!=='无'?'⚠ '+m.health.injuries:'无特殊禁忌'} <span style="float:right;cursor:pointer;text-decoration:underline" onclick="finishPlan()">完成(${(S.plans[m.id]||[]).length})</span></div>`:''}
        <div class="search"><input id="kw" placeholder="搜索动作名字" value="${f.kw}" oninput="S.lib.kw=this.value;S.lib.page=1;save();render();refocus()"></div>
        <div class="eqchips">${EQS.map(e=>`<div class="eqchip ${f.eq===e?'on':''}" onclick="setEQ('${e}')">${e}</div>`).join('')}</div>
      </div>
      <div class="lib-body">
        <div class="cnt"><span>${f.bp==='全部'?'全部部位':f.bp} · ${all.length} 个动作</span><span>${pg}/${pages}</span></div>
        <div class="grid">
          ${slice.map(e=>`
            <div class="ex" onclick="openEx('${e.id}')">
              <div class="thumb">${e.img?`<img src="${e.img}" loading="lazy" alt="${e.zh}">`:''}</div>
              <span class="lb">讲解</span>${e.risk?'<span class="riskdot">!</span>':''}
              <div class="body"><div class="nm">${e.zh}</div><div class="meta">${e.eq||''}</div></div>
            </div>`).join('')}
        </div>
        ${pages>1?`<div class="pager"><button ${pg<=1?'disabled':''} onclick="setPage(${pg-1})">上一页</button><span>${pg} / ${pages}</span><button ${pg>=pages?'disabled':''} onclick="setPage(${pg+1})">下一页</button></div>`:''}
      </div>
    </div>
  </div>`;
}
function setBP(b){S.lib.bp=b;S.lib.page=1;save();render();}
function setEQ(e){S.lib.eq=e;S.lib.page=1;save();render();}
function setPage(p){S.lib.page=p;save();render();}
function refocus(){const e=document.getElementById('kw');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}}
function finishPlan(){go('plan');}

/* ================= 动作详情 ================= */
let curEx=null;
function openEx(id){
  curEx=EXERCISES.find(e=>e.id===id);
  const m=S.forMember?M(S.forMember):null;
  let warn='';
  if(m){
    const inj=m.health.injuries, zh=curEx.zh||'';
    if(inj.includes('膝')&&/(深蹲|跳|跑|箭步|提踵|蹲)/.test(zh))
      warn=`<div class="note red">⚠ <b>禁忌提示</b>：${m.name} 禁忌为「${inj}」，该动作涉及膝关节负荷，加入前请确认。</div>`;
    if(inj.includes('腰')&&/(硬拉|俯身|前屈|早安|划船|弯腰)/.test(zh))
      warn=`<div class="note red">⚠ <b>禁忌提示</b>：${m.name} 有腰椎间盘突出史，该动作涉及腰椎负荷。</div>`;
    if(m.health.bp&&parseInt(m.health.bp)>140)
      warn=`<div class="note red">⚠ <b>强度提示</b>：${m.name}（${m.health.bp}）血压偏高，控制强度。</div>`;
  }
  const bps=(curEx.bp||'').split(/[,，、;；]/).filter(Boolean).map(s=>`<span class="tg bp">${s.trim()}</span>`).join('');
  document.getElementById('sheetIn').innerHTML=`
    <div class="sheet-h">
      <div><div class="t">${curEx.zh}</div><div class="e">${curEx.en}</div></div>
      <button class="close" onclick="closeSheet()">✕</button>
    </div>
    <div class="demo">${curEx.img?`<img src="${curEx.img}" alt="${curEx.zh}">`:''}</div>
    <div class="tagrow">${bps}${curEx.eq?`<span class="tg">${curEx.eq}</span>`:''}${curEx.tp?`<span class="tg">${curEx.tp}</span>`:''}${curEx.risk?'<span class="tg rk">⚠ 高危</span>':''}</div>
    ${curEx.tg?`<h4>目标肌肉</h4><div style="font-size:12.5px;color:#33465c;line-height:1.7">${curEx.tg}</div>`:''}
    ${curEx.sec?`<h4>协同肌肉</h4><div style="font-size:12.5px;color:#33465c;line-height:1.7">${curEx.sec}</div>`:''}
    ${warn}
    <h4>动作规范</h4>
    <div class="steps">${(curEx.fx||'暂无讲解').split(/\n+/).filter(Boolean).map((s,i)=>`<div class="step"><div class="no">${i+1}</div><div>${s}</div></div>`).join('')}</div>
    ${m?`<div class="btnrow"><button class="btn primary" onclick="addToPlan()">加入 ${m.name} 的计划</button></div>`:''}
  `;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){document.getElementById('sheet').classList.remove('on');}
function addToPlan(){
  const m=S.forMember; if(!m||!curEx)return;
  S.plans[m]=S.plans[m]||[];
  if(S.plans[m].some(p=>p.id===curEx.id)){toast('已在计划中');return;}
  S.plans[m].push({id:curEx.id,zh:curEx.zh,sets:4,reps:12});
  save();closeSheet();toast('已加入计划');render();
}

/* ================= 计划 ================= */
function viewPlan(){
  const ids=Object.keys(S.plans).filter(k=>(S.plans[k]||[]).length);
  if(!ids.length) return `<div class="scroll"><div class="empty">还没有计划<br><br>去「会员」选一位 → 排训练计划</div>
    <div class="btnrow"><button class="btn primary" onclick="go('members')">去选会员</button></div></div>`;
  return `<div class="scroll">`+ids.map(mid=>{
    const m=M(mid),pl=S.plans[mid];
    return `<h3 class="sec">${m.name} <span style="font-size:10.5px;color:var(--dim)">${pl.length} 个动作</span></h3>
    <div class="card">${pl.map((p,i)=>`
      <div class="pitem"><div class="idx">${i+1}</div>
        <div class="info"><div class="nm">${p.zh}</div>
        <div class="cfg"><input value="${p.sets}" style="width:38px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;font-size:11px;text-align:center" onchange="upd('${mid}',${i},'sets',this.value)"> 组 ×
        <input value="${p.reps}" style="width:38px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;font-size:11px;text-align:center" onchange="upd('${mid}',${i},'reps',this.value)"> 次</div></div>
        <button class="del" onclick="rm('${mid}',${i})">✕</button></div>`).join('')}
      <div class="btnrow"><button class="btn ghost" onclick="go('library',{forMember:'${mid}'})">加动作</button><button class="btn teal" onclick="doRecord('${mid}')">完成打卡</button></div>
    </div>`;
  }).join('')+`</div>`;
}
function upd(mid,i,k,v){S.plans[mid][i][k]=v;save();}
function rm(mid,i){S.plans[mid].splice(i,1);save();render();toast('已删除');}
function doRecord(mid){
  const m=M(mid);
  S.records[mid]=S.records[mid]||[];
  const d='09-19';
  S.records[mid].push({date:d,items:S.plans[mid].map(p=>p.zh)});
  m.last=d; m.history.unshift({d:d,t:'训练执行 · '+S.plans[mid].length+'个动作',n:'已完成打卡'});
  save();render();toast('✓ 已记录，数据已沉淀');
}

render();
</script>
</body>
</html>
